# Home Tutor Agent — example configuration
#
# Copy to config.yaml and edit, OR override individual values via environment
# variables prefixed with HTA_ (e.g. HTA_MEMORY_LIMITBYTES, HTA_BUFFER_STRATEGY).
# Missing config files are silently skipped; the service boots from defaults.
# Malformed YAML or invalid values fail fast at startup (D-04).
#
# See pkg/infra/config.go for the authoritative schema and validation rules.

memory:
  # 150 MB budget on the 1C/1G VPS — RES-01. Leaves headroom for the OS
  # and the Python sidecar.
  limitBytes: 157286400
  # How often the runtime is sampled against limitBytes. 5s is well inside
  # the safe range for runtime.ReadMemStats (stop-the-world cost).
  monitorInterval: 5s
  # Ascending percent-of-budget alert thresholds (D-70).
  thresholds: [80, 90, 95]
  # Percent-of-budget at which new work is rejected (D-18).
  loadShedAtPercent: 95

session:
  # Hard cap on concurrent sessions — RES-03. At-capacity Register calls
  # return ErrTooManyConnections; main.go's HTTP layer translates to 429.
  maxConcurrent: 100
  # How long a connection may go without activity before the cleaner reaps it.
  idleTimeout: 5m
  # Sweep cadence for stale-connection eviction (D-57).
  cleanupInterval: 30s

buffer:
  # PCM frame size: 20ms @ 16kHz mono = 640 bytes (D-71). Non-negotiable.
  audioFrameBytes: 640
  # Number of frames pre-allocated in the sync.Pool (D-69).
  poolSize: 1000
  # Only drop-oldest supported in Phase 1 (D-73).
  strategy: drop-oldest

server:
  # Public service listen address (HTTP + WebSocket).
  addr: "0.0.0.0:8080"
  # Slowloris defences (D-22).
  readTimeout: 10s
  # Must exceed the photo vision deadline (60s) plus write-back margin,
  # else the response is cut off after OCR already succeeded (issue #42).
  writeTimeout: 75s
  # Localhost-only health/metrics listener. Kept separate from the public
  # addr so probe traffic does not compete with session traffic.
  healthAddr: "127.0.0.1:8081"
  # ------------------------------------------------------------------
  # Phase 8 (WEB-02): student web interface static file serving.
  #
  # staticDir is the directory served as static files. Empty DISABLES
  # static serving — the service falls back to debug test pages and the
  # student interface will NOT load. Set this to enable the student
  # interface.
  #
  # Relative paths resolve against the process CWD, so the service MUST
  # be started from the repo root (use `make run` or ./run.ps1) for the
  # relative path below to resolve. For production use an absolute path
  # (e.g. /opt/hta/pkg/web/static).
  # ------------------------------------------------------------------
  staticDir: ./pkg/web/static
  # URL prefix where the static file server mounts. Default "/". MUST
  # start with "/" and MUST NOT collide with "/ws" (ServeMux matches the
  # longer "/ws" pattern first so they coexist).
  staticRoute: /

log:
  # debug | info | warn | error
  level: info
  # json (machine-parseable) | console (human-readable)
  format: json
  # stderr captures by systemd / container runtimes
  output: stderr

worker:
  # Number of worker goroutines. 2*runtime.NumCPU() on a 2-core VPS = 4.
  poolSize: 4
  # Bounded queue depth. When full, Submit returns ErrWorkerPoolFull and
  # the caller (HTTP layer) translates to 503.
  queueSize: 256

connection:
  # Per-outbound-connection token bucket (D-66). DoS mitigation.
  throttleRatePerSec: 100
  throttleBurst: 10
  dialTimeout: 5s

shutdown:
  # Maximum time allowed for in-flight requests to complete before the
  # process force-exits. 30s satisfies systemd / k8s termination grace
  # periods (D-21).
  timeout: 30s

python:
  # --------------------------------------------------------------------
  # pkg/pybridge subprocess configuration (Phase 3, PY-01).
  # See pkg/infra/config.go PythonConfig for the authoritative schema.
  # D-05 INVARIANT: this block MUST NOT contain VOLCENGINE_TTS_* secrets.
  # TTS credentials travel from the live process environment (os.Getenv in
  # pkg/pybridge) directly into the spawned subprocess env — they are
  # intentionally absent here so they never enter git history.
  # --------------------------------------------------------------------

  # Absolute path to the venv python used to spawn vocab_manager.py and
  # pregenerate_dictation.py (D-04). `make py-bootstrap` creates this venv.
  # Example for the 1C/1G VPS deployment:
  interpreter: /opt/hta/venv/bin/python

  # Directory holding the vendored Python scripts (D-03 vendor). Vendored at
  # third_party/python/ in this repo — see `make py-sync` for upstream sync.
  scriptsDir: third_party/python

  # Filename of the FSRS vocab_manager script inside scriptsDir (D-03).
  vocabScript: vocab_manager.py
  # Filename of the pregenerate_dictation script inside scriptsDir (D-03).
  pregenScript: pregenerate_dictation.py

  # Runtime SQLite DB path (env DICTATION_DB_PATH) for FSRS state (D-09/D-10).
  vocabDBPath: /opt/hta/data/vocab.db
  # Runtime data directory (env DICTATION_DATA_DIR) for non-cache state.
  dataDir: /opt/hta/data
  # Runtime cache directory (env DICTATION_CACHE_DIR) where pregenerate writes
  # mp3 files (D-06 — Go holds paths/manifest, not audio bytes).
  cacheDir: /opt/hta/data/cache/audio
  # Runtime manifest directory (env DICTATION_MANIFEST_DIR).
  manifestDir: /opt/hta/data/cache
  # Non-secret .env file (env DICTATION_ENV_FILE) the subprocess may load for
  # DICTATION_* path overrides. VOLCENGINE_TTS_* secrets are NOT placed here
  # (D-05).
  envFile: /opt/hta/data/dictation.env

  # Subprocess wall-clock caps. vocab_manager is in-process fast (10s); the
  # pregenerate call batches TTS + ffmpeg for an entire word list so it is
  # allowed longer (D-01 spawn-per-call, cold-start amortised over the batch).
  # mgmtTimeout covers the Phase 9 management commands (add/edit/rename/delete)
  # — in-process SQLite writes, same 10s profile as due/review.
  dueTimeout: 10s
  reviewTimeout: 10s
  pregenTimeout: 120s
  mgmtTimeout: 10s

  # Global bounded-semaphore cap on simultaneously running Python subprocesses
  # (D-02). Prevents 50-100 concurrent sessions from fork-bombing the 1C/1G
  # VPS. MUST be in [1, 4]. Recommended 2 — see RESEARCH Pitfall 7 memory
  # math (each pregenerate call holds ~50-100MB transient Python memory; 2 ×
  # 100MB = 200MB worst case, within the VPS headroom outside the 150MB Go
  # budget).
  maxConcurrent: 2

ws:
  # --------------------------------------------------------------------
  # WebSocket runtime listener configuration (P0-1).
  # See pkg/infra/config.go WSConfig for the authoritative schema.
  #
  # DEFAULTS: this entire block is OPTIONAL. With NO ws: block at all, the
  # service boots on the default AllowedOrigins [localhost, 127.0.0.1] —
  # exactly what a local dev session needs. Set production origins here.
  #
  # D-24: the wildcard origin "*" is FORBIDDEN and rejected at both the infra
  # (pkg/infra WSConfig.Validate) and ws (pkg/ws ServerConfig.Validate) layers.
  #
  # IN-03: ws.ServerConfig.CheckOrigin matches scheme+host+port, so you MUST
  # include the port for any non-default port, e.g. "tutor.example.com:8080".
  # A bare "tutor.example.com" matches "http://tutor.example.com" but NOT
  # "http://tutor.example.com:8080" — the browser is silently rejected.
  #
  # DOUBLE VALIDATION: zero-valued maxMessageBytes/readBufferSize/
  # writeBufferSize fall back to the ws package's own semantic defaults
  # (65551 / 4096 / 4096) at construction time in cmd/service/main.go. Leave
  # them 0 unless you have a reason to override.
  # --------------------------------------------------------------------

  # Origin whitelist. Defaults to localhost/127.0.0.1 for dev. PRODUCTION
  # MUST set the real origin(s) here.
  # allowedOrigins: [localhost, 127.0.0.1]

  # Ping cadence (D-14). Default 30s == ws.DefaultHeartbeatInterval.
  # heartbeatInterval: 30s

  # Single-frame read limit. 0 → ws fills 65551 (header + max uint16 payload).
  # maxMessageBytes: 0

  # gorilla buffer sizes. 0 → ws fills 4096 for each.
  # readBufferSize: 0
  # writeBufferSize: 0

  # Hub capacity + channel buffers (D-04). Default 100 matches session.maxConcurrent.
  # hubLimit: 100
  # hubRegisterBuffer: 32
  # hubUnregisterBuffer: 32

  # Router per-MsgType channel capacity + worker count (D-16).
  # routeBuffer: 32
  # workerConcurrency: 4

rt:
  # --------------------------------------------------------------------
  # /rt realtime dictation classroom configuration (Phase 13 / 13.3).
  # See pkg/infra/config.go RTConfig for the authoritative schema.
  #
  # DEFAULTS: like ws:, this block is OPTIONAL — the service boots on
  # sensible defaults (localhost origins, daily r0-YYYYMMDD lesson).
  # --------------------------------------------------------------------

  # 13.3-05 production anti-fat-finger switch (ROADMAP success criterion 6).
  #
  #   false (default) — permissive: a session_init with mode=test keeps the
  #     full-reveal dev behavior. Existing dev configs (config.yaml carries
  #     NO key) are untouched — the Go zero value is the default, so there
  #     is nothing to migrate.
  #   true  — the server FORCES the student projection for every /rt
  #     session: the client-supplied mode (including "test") is ignored and
  #     the word list stays masked server-side. RECOMMENDED for the family/
  #     production entry point.
  #
  # The family entry point is config.local.yaml (locally untracked, NOT in
  # git) — set rt.forceStudentMode: true there. This key is an
  # anti-fat-finger measure, NOT an authentication mechanism: it has no
  # PIN, no session, and no API gating — a child digging an old mode=test
  # URL out of history/browsing simply gets the masked student view from
  # the server (consensus decision 3).
  #
  # forceStudentMode: true
