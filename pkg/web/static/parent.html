<!DOCTYPE html>
<!--
  Parent Vocabulary Management — Home Tutor Agent (Phase 9, Plan 01;
  Phase 13.3 page-level tabs: 学习记录 | 词库 | 设置).
  Served by the Go backend's static file server at /parent.html.
  REST page — NO connection indicator (unlike the student WebSocket page).

  D-04 — REVISED 2026-10-09 (13.3 consensus 拷问定案): the URL-only access
  rule is ABOLISHED. There is no PIN, no session, no permission gate on
  this page; the management entry is discoverable (home.html, the family
  home, links here publicly). KEPT unchanged: the child-facing classroom
  surface stays free of management entry points — 课堂内无管理操作.
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <!--
    Viewport mirrors index.html (width=device-width, maximum-scale=1.0).
    The PRIMARY zoom-on-focus defense is `touch-action: manipulation` in
    parent.css plus 16px font-size on inputs, per iOS Safari rules.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#f5f7fa">
  <meta name="description" content="听写小助手家长页：查看学习记录，管理听写词库，调整学习设置">
  <title>听写小助手（家长端）</title>
  <link rel="stylesheet" href="styles/parent.css?v=20261026a">
</head>
<body>
  <!-- Skip to main content link for accessibility (mirrors index.html) -->
  <a href="#main-content" class="skip-to-content">跳转到主要内容</a>

  <div class="container">
    <!-- Header: Display title + subtitle naming the three tabs below -->
    <header class="app-header">
      <h1 class="page-title">听写小助手（家长端）</h1>
      <p class="subtitle">查看学习记录、整理词库、调整学习设置。</p>
    </header>

    <!--
      Page-level tab bar (13.3-01 Task 1 checkpoint ③ confirmed form):
      学习记录 | 词库 | 设置. parent-app.js toggles each tab's
      aria-selected plus the target panel's hidden attribute — the
      settingsSection hidden-attribute precedent, never display:none
      inline styles. The default tab (学习记录) resets on every load;
      tab state is deliberately NOT persisted.
    -->
    <nav class="parent-tabs" role="tablist" aria-label="页面切换">
      <button type="button" class="parent-tab active" id="parent-tab-lessons"
              role="tab" aria-selected="true" aria-controls="lessonsSection">学习记录</button>
      <button type="button" class="parent-tab" id="parent-tab-vocab"
              role="tab" aria-selected="false" aria-controls="vocabPanel">词库</button>
      <button type="button" class="parent-tab" id="parent-tab-settings"
              role="tab" aria-selected="false" aria-controls="settingsPanel">设置</button>
    </nav>

    <main class="main-content" id="main-content" role="main">
      <!--
        学习记录 panel (13.3-03) — the DEFAULT tab. LessonsView
        (parent-lessons.js) mounts into #lessons-container.
      -->
      <section class="card lessons-section" id="lessonsSection"
               role="tabpanel" aria-labelledby="parent-tab-lessons">
        <h2 class="card-title" id="lessonsSectionTitle">学习记录</h2>
        <div id="lessons-container"></div>
      </section>

      <!--
        词库 panel: 添加单词 → 浏览词库, carried over UNCHANGED from the
        pre-tab page — internal DOM ids, the shared datalist and the aria
        structure stay exactly as they were, because AddCard/BrowseView
        mount by id + defer order (Pitfall 8: tab conversion must not
        break the existing components).
        Section order per UI-SPEC Layout: 添加单词 → 浏览词库.
      -->
      <div class="parent-panel parent-panel-vocab" id="vocabPanel"
           role="tabpanel" aria-labelledby="parent-tab-vocab" hidden>
        <section class="card add-section" id="addSection"
                 role="region" aria-labelledby="addSectionTitle">
          <h2 class="card-title" id="addSectionTitle">添加单词</h2>
          <!-- AddCard (parent-modes.js) mounts the 单个添加 | 批量添加 tabs
               plus both forms here. -->
          <div id="add-form-container"></div>
          <!-- Shared 单元 datalist: both add forms' 单元 inputs reference
               list="unit-options"; parent-app.js populates it from
               GET /api/v1/units for the selected category (Plan 09-06). -->
          <datalist id="unit-options"></datalist>
        </section>

        <section class="card browse-section" id="browseSection"
                 role="region" aria-labelledby="browseSectionTitle" aria-live="polite">
          <h2 class="card-title" id="browseSectionTitle">浏览词库</h2>
          <div id="word-list-container"></div>
        </section>
      </div>

      <!--
        设置 panel. 学习设置 stays hidden until SettingsCard mounts and
        unhides it — no JS, no empty card (Plan 09-07 tracer-era contract,
        untouched by the tab conversion).
      -->
      <div class="parent-panel parent-panel-settings" id="settingsPanel"
           role="tabpanel" aria-labelledby="parent-tab-settings" hidden>
        <section class="card settings-section" id="settingsSection" hidden
                 role="region" aria-labelledby="settingsSectionTitle">
          <h2 class="card-title" id="settingsSectionTitle">学习设置</h2>
          <div id="settings-container"></div>
        </section>
      </div>
    </main>
  </div>

  <!--
    Scripts: loaded with `defer` so they execute in order after the DOM is
    parsed. Load order matters (defer preserves it):
      vendor/pdfjs/pdf.min.js   → window.pdfjsLib (pdf.js UMD build, Apache-2.0;
                                  the worker file is fetched by parent-pdf.js;
                                  Issue #7 scanned-PDF page split, ADR-0004)
      js/parent-batch-parser.js → window.parseBatch (pure paste parser, NO DOM)
      js/parent-modes.js        → window.SingleAddForm/BatchAddForm/AddCard
                                  (添加单词 card components; AddCard reads
                                  window.parseBatch when 解析并预览 is
                                  clicked; also exports __parentFormKit)
      js/parent-import-core.js  → per-photo OCR identity store (Issue #80 U3)
      js/parent-pdf-core.js     → the scanned-PDF pure functions (page plan
                                  status machine, per-page merge, commit
                                  slicing — Issue #7, Node-tested)
      js/parent-meaning-core.js → the supplement pure functions (eligibility,
                                  reply folding, marker display rules —
                                  Issue #8, Node-tested)
      js/parent-photo.js        → window.PhotoAddForm +
                                  window.classifyPhotoEntries (照片导入 tab,
                                  Issue #3/#5/#7/#8/#81 并排核对工作区;
                                  consumes __parentFormKit)
      js/parent-pdf.js          → window.PdfPageRunner (pdf.js loader +
                                  per-page renderer, Issue #7)
      js/parent-browse.js       → window.BrowseView (浏览词库: toolbar +
                                  unit groups + edit/rename/delete modals;
                                  also exports __parentModalKit)
      js/parent-textbook.js     → window.TextbookUI + pure helpers
                                  (教材管理/批量指定 modals, Issue #4;
                                  consumes __parentModalKit)
      js/parent-lessons.js      → window.LessonsView (学习记录: recent-
                                  lessons list + vertical per-word detail)
      js/parent-app.js          → wires them together (entry, fetchJSON,
                                  unit datalist population, page tabs)
  -->
  <script src="vendor/pdfjs/pdf.min.js?v=3.11.174" defer></script>
  <script src="js/parent-batch-parser.js?v=20261009a" defer></script>
  <script src="js/parent-batch-edit.js?v=20261028a" defer></script>
  <script src="js/parent-modes.js?v=20261013b" defer></script>
  <script src="js/parent-import-core.js?v=20261028a" defer></script>
  <script src="js/parent-pdf-core.js?v=20261014a" defer></script>
  <script src="js/parent-meaning-core.js?v=20261014a" defer></script>
  <script src="js/parent-photo.js?v=20261028a" defer></script>
  <script src="js/parent-pdf.js?v=20261014a" defer></script>
  <script src="js/parent-browse.js?v=20261027a" defer></script>
  <script src="js/parent-textbook.js?v=20261012b" defer></script>
  <script src="js/parent-lessons.js?v=20261016a" defer></script>
  <script src="js/parent-app.js?v=20261013a" defer></script>
</body>
</html>
