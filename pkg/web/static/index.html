<!DOCTYPE html>
<!--
  Student Dictation Interface — Home Tutor Agent (Phase 8, Plan 01).
  Served by the Go backend's static file server at the configured route.
  Designed for iPad Safari (768x1024 viewport), optimized for elementary
  school students (ages 6-12). Vanilla JS + CSS only — no build step, no
  framework, to respect the 1C/1G VPS constraint (see 08-RESEARCH.md).
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <!--
    Viewport: width=device-width with maximum-scale=1.0 + user-scalable=no
    prevents accidental pinch-zoom that breaks the kid-friendly layout. The
    PRIMARY zoom-on-focus defense is `touch-action: manipulation` in CSS
    (Pitfall 1) plus 16px+ font-size on any input, per iOS Safari rules.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#4facfe">
  <meta name="description" content="小学生英语听写练习 — 听写小助手">
  <title>听写小助手</title>
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <!-- Skip to main content link for accessibility (Plan 08-04 Task 3) -->
  <a href="#main-content" class="skip-to-content">跳转到主要内容</a>
  <!-- Connection status indicator (Pitfall 4: always show connection state) -->
  <div class="connection-indicator" id="connectionStatus" role="status"
       aria-live="polite" aria-atomic="true" data-state="connecting">
    <span class="status-dot" aria-hidden="true"></span>
    <span class="connection-text">连接中…</span>
  </div>

  <div class="container">
    <!-- Header with friendly greeting -->
    <header class="app-header">
      <h1>🎓 听写小助手</h1>
      <p class="subtitle">和你的好朋友一起学单词</p>
    </header>

    <!-- Main interaction area -->
    <main class="main-content" id="main-content" role="main">
      <!--
        Session request section: the prominent "I want to dictate 30 words"
        CTA mounts into #session-button-container (ui-components.js). Visible
        by default; the SessionButton component manages its own label and
        disabled state from the SessionStateManager (DICT-01).

        Wave 2 replaced Wave 1's static 10/20/30 word-count selector and
        disabled start button with this single JS-driven component so there
        is exactly one prominent affordance on page load.

        Plan 08-04 Task 3: Enhanced accessibility with proper ARIA roles
        and semantic HTML structure.
      -->
      <section class="session-request-section" id="sessionRequest"
               role="region" aria-labelledby="sessionRequestTitle" aria-live="polite" aria-atomic="true">
        <h2 id="sessionRequestTitle">准备好了吗？开始今天的听写吧！</h2>

        <!-- SessionButton (ui-components.js) mounts here -->
        <div id="session-button-container" role="group" aria-label="会话控制按钮"></div>

        <!--
          Batch mode toggle (Ticket 05): check this to write every word on
          paper through the dictation and submit/grade everything at the end
          (the traditional classroom rhythm). Unchecked = per-word answering
          (speech / photo / manual). Read at flow time, not session start.
        -->
        <label class="batch-mode-toggle">
          <input type="checkbox" id="batch-mode-toggle">
          ✍️ 批量模式：全部听完后一起提交
        </label>
      </section>

      <!--
        Progress display section: shows dictation progress while a session
        runs. Hidden until app.js reveals it on session start.

        Wave 3 replaced Wave 1's static inline progress markup with a single
        JS-driven container (#progress-display-container). ProgressDisplay
        (ui-components.js) renders the status text, progress bar, word counter,
        and encouragement into it from the authoritative SessionStateManager
        state — same pattern Wave 2 used for #session-button-container.

        Plan 08-04 Task 3: Enhanced accessibility with ARIA live region.
      -->
      <section class="progress-display-section" id="progressDisplay"
               role="region" aria-labelledby="progressTitle" aria-live="polite" aria-atomic="true" hidden>
        <h2 id="progressTitle" class="visually-hidden">听写进度</h2>

        <!-- ProgressDisplay (ui-components.js) mounts here -->
        <div id="progress-display-container" role="status" aria-live="polite" aria-atomic="true"></div>
      </section>

      <!--
        Dictation controls: pause/resume, repeat, next word buttons
        (Ticket 02, DICT-07). Visible only during active dictation.
      -->
      <section class="dictation-controls-section" id="dictationControls"
               role="region" aria-labelledby="dictationControlsTitle" hidden>
        <h2 id="dictationControlsTitle" class="visually-hidden">听写控制</h2>
        <!--
          Voice command mic (Ticket 03): push-to-talk capture streamed to the
          backend for Mimo ASR + intent analysis. VoiceCommandButton mounts
          here and renders nothing when getUserMedia is unavailable — the
          three buttons below stay the always-available fallback.
        -->
        <div id="voice-command-container"></div>
        <!--
          Photo answer (Ticket 04): one-tap camera capture of the handwritten
          answer, streamed as IMAGE frames for Mimo vision OCR.
          PhotoAnswerButton mounts here; when OCR is low-confidence or fails,
          the ManualAnswerForm (below the controls) takes over prefilled.
        -->
        <div id="photo-answer-container"></div>
        <div id="dictation-controls-container"></div>
        <!-- Manual-input fallback (Ticket 04): prefilled from the OCR best
             guess when confidence is low; submits via submit_answer. Hidden
             via the form's own display:none from construction (single
             visibility mechanism). -->
        <div id="manual-answer-container"></div>
        <!-- Batch submission form (Ticket 05): one numbered row per word,
             shown at WAITING_PARENT in batch mode. -->
        <div id="batch-submission-container"></div>
      </section>

      <!-- Dictation feedback section: shows recording/wrong/correct per word -->
      <section class="dictation-feedback-section" id="dictationFeedback"
               role="region" aria-labelledby="dictationFeedbackTitle" hidden>
        <h2 id="dictationFeedbackTitle" class="visually-hidden">听写反馈</h2>
        <div id="dictation-feedback-container"></div>
      </section>

      <!--
        Feedback report section (Ticket 06): the post-grading analysis screen.
        FeedbackReport (ui-components.js) mounts here on analysis_result —
        score, char-level error highlights, patterns, suggestions, trends.
        Unlike the sections above it survives session end (it IS the
        end-of-session display); it hides when the next session starts.
      -->
      <section class="feedback-report-section" id="feedbackReport"
               role="region" aria-labelledby="feedbackReportTitle" hidden>
        <h2 id="feedbackReportTitle" class="visually-hidden">听写报告</h2>
        <div id="feedback-report-container"></div>
      </section>
    </main>

    <!-- Footer with simple instructions -->
    <footer class="app-footer">
      <p>💡 点上面的按钮，开始听写 30 个单词</p>
    </footer>
  </div>

  <!--
    Scripts: loaded with `defer` so they execute in order after the DOM is
    parsed. Load order matters (defer preserves it):
      frame-codec.js      → window.FrameCodec + SequenceCounter (wire format)
      websocket-client.js → window.WebSocketClient (transport; uses FrameCodec)
      state-manager.js    → window.SessionStateManager (state store)
      audio-controller.js → window.AudioController (Web Audio API integration)
      speech-controller.js→ window.SpeechController (Web Speech API answers)
      voice-command-controller.js → window.VoiceCommandController (mic capture)
      photo-controller.js → window.PhotoAnswerController (camera answer, Ticket 04)
      ui-components.js    → window.SessionButton (uses the state store)
      app.js              → wires them together
  -->
  <script src="js/frame-codec.js" defer></script>
  <script src="js/websocket-client.js" defer></script>
  <script src="js/state-manager.js" defer></script>
  <script src="js/audio-controller.js" defer></script>
  <script src="js/speech-controller.js" defer></script>
  <script src="js/voice-command-controller.js" defer></script>
  <script src="js/photo-controller.js" defer></script>
  <script src="js/ui-components.js" defer></script>
  <script src="js/app.js" defer></script>
</body>
</html>
