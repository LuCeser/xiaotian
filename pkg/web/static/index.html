<!DOCTYPE html>
<!--
  Student Dictation Interface — Home Tutor Agent (Phase 8, Plan 01).
  Served by the Go backend's static file server at the configured route.
  Designed for iPad Safari (768x1024 viewport), optimized for elementary
  school students (ages 6-12). Vanilla JS + CSS only — no build step, no
  framework, to respect the 1C/1G VPS constraint (see 08-RESEARCH.md).
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <!--
    Viewport: width=device-width with maximum-scale=1.0 + user-scalable=no
    prevents accidental pinch-zoom that breaks the kid-friendly layout. The
    PRIMARY zoom-on-focus defense is `touch-action: manipulation` in CSS
    (Pitfall 1) plus 16px+ font-size on any input, per iOS Safari rules.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#4facfe">
  <meta name="description" content="小学生英语听写练习 — 听写小助手">
  <title>听写小助手</title>
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <!-- Connection status indicator (Pitfall 4: always show connection state) -->
  <div class="connection-indicator" id="connectionStatus" role="status"
       aria-live="polite" aria-atomic="true" data-state="connecting">
    <span class="status-dot" aria-hidden="true"></span>
    <span class="connection-text">连接中…</span>
  </div>

  <div class="container">
    <!-- Header with friendly greeting -->
    <header class="app-header">
      <h1>🎓 听写小助手</h1>
      <p class="subtitle">和你的好朋友一起学单词</p>
    </header>

    <!-- Main interaction area -->
    <main class="main-content">
      <!--
        Session request section: student picks a word count and starts.
        Visible by default. Hidden by app.js once a session is active.
      -->
      <section class="session-request-section" id="sessionRequest"
               aria-labelledby="sessionRequestTitle">
        <h2 id="sessionRequestTitle">今天想听写多少个单词？</h2>

        <div class="word-count-selector" role="group"
             aria-label="选择听写单词数量">
          <button type="button" class="kid-button word-count-btn"
                  data-count="10" aria-pressed="false">10 个</button>
          <button type="button" class="kid-button word-count-btn"
                  data-count="20" aria-pressed="false">20 个</button>
          <button type="button" class="kid-button word-count-btn"
                  data-count="30" aria-pressed="false">30 个</button>
        </div>

        <button type="button" class="kid-button session-button"
                id="startSession" disabled aria-disabled="true">
          🎤 开始听写
        </button>
      </section>

      <!--
        Progress display section: shows dictation progress while a session
        runs. Hidden until app.js reveals it on session start.
      -->
      <section class="progress-display-section" id="progressDisplay"
               aria-labelledby="progressTitle" hidden>
        <h2 id="progressTitle" class="visually-hidden">听写进度</h2>

        <div class="progress-status">
          <span class="status-icon" aria-hidden="true">📝</span>
          <span class="status-text" id="progressText">准备中…</span>
        </div>

        <div class="progress-container" role="progressbar"
             aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"
             aria-label="听写进度">
          <div class="progress-bar progress-fill" id="progressBar" style="width: 0%"></div>
        </div>

        <div class="word-counter" aria-live="polite">
          第 <span id="currentWord">0</span> / <span id="totalWords">0</span> 个单词
        </div>

        <!-- Visual encouragement for young students -->
        <div class="encouragement" id="encouragement" aria-live="polite"></div>
      </section>
    </main>

    <!-- Footer with simple instructions -->
    <footer class="app-footer">
      <p>💡 先选单词数量，再点「开始听写」</p>
    </footer>
  </div>

  <!--
    Application entry point (Phase 8, Plan 01/03). Loaded with `defer` so the
    DOM is parsed before app.js runs. Task 3 wires the WebSocket client here.
  -->
  <script src="js/app.js" defer></script>
</body>
</html>
