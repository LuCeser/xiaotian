<!DOCTYPE html>
<!--
  Natural Real-Time Tutor page — /tutor/ (Phase 13, Plan 05, RT-01).

  The PRIMARY student entry for the R0 minimal loop: one-gesture audio
  authorization, then continuous listen/speak with the /rt WebSocket
  (pkg/rt/protocol.go wire contract). The legacy button-driven dictation
  page (/) stays as the explicitly-labeled degraded fallback (RT-10).

  Vanilla JS + CSS only — no build step (1C/1G VPS constraint, same as the
  legacy page). Designed for iPad Safari 768x1024; touch targets ≥60px.
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#4f8ef7">
  <meta name="description" content="自然实时家教 — 听说小老师">
  <title>听说小老师 · 自然实时家教</title>
  <link rel="stylesheet" href="styles/tutor.css?v=20261016accent">
</head>
<body data-page="tutor">

  <!-- Top status bar: student-facing turn state + connection state -->
  <header class="rt-topbar">
    <div class="rt-state" id="rt-status" data-state="idle" role="status" aria-live="polite">
      <span class="rt-state-chip" data-chip="listening">🎧 听取中</span>
      <span class="rt-state-chip" data-chip="processing">💭 思考中</span>
      <span class="rt-state-chip" data-chip="speaking">🗣 讲授中</span>
      <span class="rt-state-chip" data-chip="paused">⏸ 休息中</span>
      <span class="rt-state-chip" data-chip="grading">✅ 检查中</span>
      <span class="rt-state-chip" data-chip="ended">🎓 课程结束</span>
    </div>
    <div class="rt-conn" id="rt-conn" data-conn="idle" role="status">
      <span class="rt-conn-dot" aria-hidden="true"></span>
      <span class="rt-conn-text" id="rt-conn-text">未连接</span>
    </div>
  </header>

  <main class="rt-main">

    <!--
      Poem task banner (Issue #12): shown only on a whole-poem 背默 session
      (session_ready.poem) — the work's identity (title·author·line count)
      and the practice way. The poem's TEXT never renders here; the chips
      below stay line-number placeholders until check_started reveals them.

      Passage task banner (Issue #14): the twin for a passage-range 背默
      session (session_ready.passage) — the work plus WHICH range this
      session covers (整篇 or the paragraph numbers). The text itself never
      renders here either.
    -->
    <section class="rt-poem" id="rt-poem" hidden aria-label="古诗背默任务"></section>
    <section class="rt-poem rt-passage" id="rt-passage" hidden aria-label="课文背默任务"></section>

    <!--
      Subject clarify panel (Issue #55): shown when an auto (unspecified-
      subject) entry finds BOTH subjects holding due words — the server asks
      the CHILD which one to dictate (subject_ask), the same question the
      teacher speaks. The two buttons answer with subject_pick; a spoken
      语文/英语 works interchangeably (the buttons just mirror the voice
      path). Hidden again when the picked classroom's session_ready arrives.
    -->
    <section class="rt-subject-ask" id="rt-subject-ask" hidden aria-label="选择默写学科">
      <p class="rt-subject-ask-text" id="rt-subject-ask-text"></p>
      <div class="rt-subject-ask-buttons">
        <button id="rt-subject-zh" class="rt-btn rt-subject-btn" type="button">默写语文</button>
        <button id="rt-subject-en" class="rt-btn rt-subject-btn" type="button">默写英语</button>
      </div>
    </section>

    <!-- Lesson progress: words + current_index from session_ready / lesson_update -->
    <section class="rt-progress" aria-label="课堂进度">
      <div class="rt-words" id="rt-words"></div>
      <div class="rt-progress-track" aria-hidden="true">
        <div class="rt-progress-fill" id="rt-progress-fill" style="width:0%"></div>
      </div>
      <div class="rt-progress-meta">
        <span id="rt-progress-text">第 - / - 个词</span>
        <span id="rt-round">第 0 轮</span>
      </div>
    </section>

    <!-- Completion banner (session_ended reason=lesson_complete, 13-11) -->
    <section class="rt-banner" id="rt-banner" hidden role="status"></section>

    <!--
      Conversation trace (13.1-02, D-10/U-7): a two-column chat in BOTH
      modes — teacher lines append left (👩‍🏫), student transcript lines
      append right (🧒) as persistent per-turn rows (never replace-in-place).
      The aria-live region stays on the container. Line count is capped
      (MAX_TRACE_LINES) by dropping the oldest.
    -->
    <section class="rt-subtitles" aria-label="对话字幕">
      <div class="rt-trace" id="rt-trace" aria-live="polite"></div>
    </section>

    <!--
      Check panel (13.1-01): hidden until check_started opens the check
      stage; renders one 对/错 row per word from check_started.words and
      re-renders EXCLUSIVELY from authoritative check_verdicts echoes
      (RT-07 — no local optimistic verdict state). 13.1-03 adds the photo
      path (拍照检查/重拍) and the per-word recognized text from ocr_result;
      提交 gates on every word carrying a MANUAL verdict in the latest echo
      — an OCR prefill shows the row as 待确认 and never counts toward the
      gate (D-05).
    -->
    <section class="rt-check" id="rt-check" hidden aria-label="默写检查"></section>

    <!-- Error panel: code → human-readable Chinese reason (RT-10) -->
    <section class="rt-error" id="rt-error" hidden role="alert">
      <p class="rt-error-code" id="rt-error-code"></p>
      <p class="rt-error-text" id="rt-error-text"></p>
    </section>

    <!-- Degradation / notice area (unsafe context, fallback hints) -->
    <section class="rt-notice" id="rt-notice" hidden role="note"></section>

    <!-- Controls: touch targets ≥60px (ipad-layout spec) -->
    <section class="rt-controls" aria-label="会话控制">
      <button id="rt-start" class="rt-btn rt-btn-start" type="button">开始上课</button>
      <button id="rt-end" class="rt-btn rt-btn-end" type="button" disabled>结束</button>
      <button id="rt-export" class="rt-btn rt-btn-export" type="button">导出时序</button>
    </section>
  </main>

  <!--
    Script load order (end-of-body, parse order = execution order):
      js/rt-client.js    → RTCClient / TimingLog / estimateClockOffset / …
      js/rt-capture.js   → RTCapture / resampleTo16k / floatToInt16
      js/rt-playback.js  → RTCPlayback / playedUntilMs / interrupt tuning
      js/rt-photo.js     → RTPhoto / check-stage photo_chunk upload (13.1-03)
    The AudioWorklet module js/rt-pcm-worklet.js is NOT a <script> — it is
    loaded from rt-capture.js via audioContext.audioWorklet.addModule()
    (registerProcessor scope has no AudioWorkletProcessor under a plain
    script tag; loading it here would throw and break the page).
  -->
  <script src="js/rt-client.js?v=20261016a"></script>
  <script src="js/rt-check-receipt.js?v=20261030check"></script>
  <script src="js/rt-capture.js?v=20261012capture-fix"></script>
  <script src="js/rt-playback.js?v=20261024reset"></script>
  <script src="js/rt-photo.js?v=20261008a"></script>
  <script>
    (function () {
      'use strict';

      function $(id) { return document.getElementById(id); }
      var startBtn = $('rt-start');
      var endBtn = $('rt-end');
      var exportBtn = $('rt-export');
      var statusEl = $('rt-status');
      var connEl = $('rt-conn');
      var connText = $('rt-conn-text');
      var wordsEl = $('rt-words');
      var progressFill = $('rt-progress-fill');
      var progressText = $('rt-progress-text');
      var roundText = $('rt-round');
      var traceEl = $('rt-trace');
      var errorEl = $('rt-error');
      var errorCodeEl = $('rt-error-code');
      var errorTextEl = $('rt-error-text');
      var noticeEl = $('rt-notice');
      var bannerEl = $('rt-banner');

      // ----- shared objects -------------------------------------------------
      var timing = new TimingLog();
      timing.push(RT_EVENTS.PAGE_READY);

      var client = new RTCClient({ timing: timing });
      var capture = new RTCapture({ timing: timing });
      var playback = new RTCPlayback({ timing: timing, client: client });
      var photo = new RTPhoto(client); // 13.1-03: check-stage photo capture

      var lesson = { words: [], currentIndex: 0, version: 0 };
      var started = false;
      var courseEnded = false;
      var readPending = false;
      // 13.1-05 D-11: the 「再练一组」 one-shot intent. The banner button sets
      // it; the start flow consumes it into client.initPractice for exactly
      // ONE practice session (one tap = one set — the practice ending never
      // offers the button again, so the loop is bounded by design).
      var practiceNext = false;
      // 13.1-05 D-13: the most recent teacher sentence text — the no-due
      // banner mirrors the server's spoken days copy from it (the server is
      // the copy authority; the page never invents a count).
      var lastTeacherText = '';

      // ----- UI mode (13.1 D-08) ---------------------------------------------
      // Only the exact value "test" keeps the full-reveal behavior; anything
      // else — including absent — is student mode (the iPad bookmark must
      // never land the child on a full word table). The mode rides
      // session_init via client.initMode; the SERVER is the masking
      // authority (13.1-02): this page renders only what it was sent and
      // never fills in a word it did not receive.
      var pageQuery = new URLSearchParams(window.location.search);
      var mode = pageQuery.get('mode') === 'test' ? 'test' : 'student';
      client.initMode = mode;
      // ----- classroom subject (Issue #10 + #55) --------------------------------
      // "english"/"chinese" are EXPLICIT declarations forwarded as-is; the
      // absent param (开始默写 door, plain bookmark) sends "auto" — the
      // server then settles it WITH the child (never a model): the one
      // subject holding due words opens directly, both subjects holding due
      // words brings the subject_ask panel (subject_pick below), neither
      // keeps the english no-due landing. The subject rides session_init
      // via client.initCategory and scopes the due fetch, the review writes
      // and the lesson row; session_ready echoes the RESOLVED subject back
      // (adopted below for re-inits).
      var declaredCategory = pageQuery.get('category');
      client.initCategory = (declaredCategory === 'chinese' || declaredCategory === 'english')
        ? declaredCategory
        : 'auto';

      // ----- subject clarify (Issue #55) ----------------------------------------
      // The subject_ask panel answers by button (subject_pick) — the spoken
      // 语文/英语 answer rides the audio path server-side, the buttons just
      // mirror it for kids who'd rather tap. Both disable on the first tap
      // (the server binds exactly once; a second pick is a no-op there).
      var subjectAskEl = $('rt-subject-ask');
      var subjectAskTextEl = $('rt-subject-ask-text');
      var subjectZhBtn = $('rt-subject-zh');
      var subjectEnBtn = $('rt-subject-en');
      client.on('subject_ask', function (m) {
        subjectAskTextEl.textContent = (m && m.question) || '';
        subjectZhBtn.disabled = false;
        subjectEnBtn.disabled = false;
        subjectAskEl.hidden = false;
        // J15 (PR #72 review P2): the clarify is a live session phase — the
        // mic is open and the teacher is mid-question — so the explicit end
        // is offered the moment the ask appears, not only after
        // session_ready. Ending here stops the ask with no classroom built.
        endBtn.disabled = false;
      });
      function pickSubject(category) {
        subjectZhBtn.disabled = true;
        subjectEnBtn.disabled = true;
        client.sendJSON({ type: 'subject_pick', category: category });
      }
      subjectZhBtn.addEventListener('click', function () { pickSubject('chinese'); });
      subjectEnBtn.addEventListener('click', function () { pickSubject('english'); });
      // ----- whole-poem 背默 classroom (Issue #12) ------------------------------
      // ?poem=<poems.id> opens the poem classroom for THAT work (the parent
      // content view's 背默这首 entry). Absent/non-numeric stays 0 = the word
      // classroom; the server applies the same deny-by-default rule.
      client.initPoem = parseInt(pageQuery.get('poem'), 10) || 0;
      // ----- passage-range 背默 classroom (Issue #14) ---------------------------
      // ?passage=<passages.id>&scope=<passage_scopes.id> opens the passage
      // classroom for that stored RANGE (the content view's per-range 背默
      // entry). Absent/non-numeric stays 0 = the word classroom.
      client.initPassage = parseInt(pageQuery.get('passage'), 10) || 0;
      client.initPassageScope = parseInt(pageQuery.get('scope'), 10) || 0;

      // poemTask mirrors session_ready.poem (display-only identity: title /
      // author / line count / method). The poem's lines themselves arrive
      // ONLY with check_started — never before (背默任务，原文不上屏).
      var poemTask = null;
      var poemEl = $('rt-poem');

      function renderPoemBanner() {
        clearChildren(poemEl);
        if (!poemTask) {
          poemEl.hidden = true;
          return;
        }
        var title = document.createElement('p');
        title.className = 'rt-poem-title';
        title.textContent = '《' + poemTask.title + '》' +
          (poemTask.author ? ' · ' + poemTask.author : '') +
          ' · 共 ' + poemTask.line_count + ' 句 · ' + poemTask.method;
        poemEl.appendChild(title);
        poemEl.hidden = false;
      }

      // passageTask mirrors session_ready.passage (Issue #14): the work PLUS
      // the practiced range (whole or the original paragraph numbers). The
      // paragraphs themselves arrive ONLY with check_started.
      var passageTask = null;
      var passageEl = $('rt-passage');

      function passageRangeText() {
        if (!passageTask) return '';
        return passageTask.whole
          ? '整篇'
          : '第 ' + (passageTask.paragraphs || []).join('、') + ' 段';
      }

      function renderPassageBanner() {
        clearChildren(passageEl);
        if (!passageTask) {
          passageEl.hidden = true;
          return;
        }
        var title = document.createElement('p');
        title.className = 'rt-poem-title';
        title.textContent = '《' + passageTask.title + '》' +
          (passageTask.author ? ' · ' + passageTask.author : '') +
          ' · ' + passageRangeText() + '共 ' + passageTask.paragraph_count + ' 段 · ' + passageTask.method;
        passageEl.appendChild(title);
        passageEl.hidden = false;
      }

      // ----- check-stage state (13.1-01) --------------------------------------
      // verdicts is a server-echo mirror ONLY: it is written by
      // check_verdicts messages and read by rendering — the 对/错 buttons
      // never mutate it on press (RT-07: no local optimistic verdict state;
      // only disabled/pending UI changes at press time). ocr is the
      // ocr_result mirror (13.1-03): display-only recognized text next to
      // each row; the verdicts still come from check_verdicts alone.
      var check = { active: false, words: [], verdicts: {}, ocr: {}, submitPending: false, resultText: '', resultKind: '' };

      // WR-01 (13.1-08): the ONE cross-lesson reset — a new session's
      // session_ready fully clears the previous lesson's check panel, both
      // the state and the DOM. Wired ONLY here: check_started keeps its own
      // reset (in-lesson restart), because session_ready is the only
      // cross-lesson boundary — a stale clickable panel would inject the old
      // lesson's check_verdict/check_submit frames into the NEW connection
      // (T-13.1-18).
      function resetCheckState() {
        check.active = false;
        check.words = [];
        check.verdicts = {};
        check.ocr = {};
        check.submitPending = false;
        check.resultText = '';
        check.resultKind = '';
        $('rt-check').hidden = true;
      }

      // ----- DOM helpers ----------------------------------------------------
      // The ONLY element-removal helper on this page: server-sourced text
      // (subtitles, transcripts, errors, teacher lines) never touches an HTML
      // parser — createElement/textContent discipline is the XSS boundary
      // (T-13-22, enforced by the negative grep gate).
      function clearChildren(el) {
        while (el.firstChild) el.removeChild(el.firstChild);
      }

      function setStatus(state) {
        statusEl.setAttribute('data-state', state);
        renderProgress();
      }

      function setConn(state, text) {
        connEl.setAttribute('data-conn', state);
        connText.textContent = text;
      }

      function showError(code, message) {
        errorCodeEl.textContent = code || 'unknown';
        errorTextEl.textContent = humanizeError(code) + (message ? '（' + message + '）' : '');
        errorEl.hidden = false;
      }

      function showNotice(text) {
        clearChildren(noticeEl);
        var p = document.createElement('p');
        p.textContent = text;
        noticeEl.appendChild(p);
        noticeEl.hidden = false;
      }

      // ----- ending banners (13.1-05, D-13: three endings, three copies) ----
      // lesson_complete: 今天的 N 个词都默写完了 + 再练一组. practice_complete:
      // the practice wrap WITHOUT the button (one tap = one set — the student
      // restarts through 开始上课, so the loop is bounded). no_due_words: the
      // days copy mirrored from the server's spoken line + 再练一组.
      function addPracticeButton(container) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'rt-btn rt-practice-btn';
        btn.textContent = '再练一组';
        btn.addEventListener('click', function () {
          if (started) return;
          btn.disabled = true; // one tap = one set; stays disabled while connecting
          practiceNext = true;
          startBtn.click(); // the SAME start flow (one gesture, RT-02)
        });
        container.appendChild(btn);
      }

      function noDueBannerText() {
        var match = /下次复习大约在\s*(\d+)\s*天后/.exec(lastTeacherText || '');
        if (match) return '词库暂无到期词，下次复习在 ' + match[1] + ' 天后。';
        return '词库暂无到期词，好好休息。';
      }

      function showEndingBanner(reason) {
        clearChildren(bannerEl);
        var p = document.createElement('p');
        if (reason === 'lesson_complete') {
          if (poemTask) {
            // Issue #12: the poem's own ending copy — the work's name, the
            // judged line count, and the honest save result.
            p.textContent = '《' + poemTask.title + '》背默完成！' +
              (check.resultText || '真棒！');
          } else if (passageTask) {
            // Issue #14: the passage's own ending copy — the work + the
            // practiced range, and the honest save result.
            p.textContent = '《' + passageTask.title + '》' + passageRangeText() + '背默完成！' +
              (check.resultText || '真棒！');
          } else {
            // N from the check state (the panel's rows = the checked words).
            p.textContent = '今天的 ' + check.words.length + ' 个词都默写完了！' +
              (check.resultText || '真棒！');
          }
          bannerEl.appendChild(p);
          // Issue #12/#14: a 背默 session never offers 再练一组 — that
          // button starts a WORD practice; re-practicing the work is a
          // fresh 背默 entry from the parent page.
          if (!poemTask && !passageTask) addPracticeButton(bannerEl);
        } else if (reason === 'practice_complete') {
          p.textContent = '这组练习完成啦，真棒！想再练就点「开始上课」。';
          bannerEl.appendChild(p); // no practice button — bounded loop by design
        } else if (reason === 'no_due_words') {
          p.textContent = noDueBannerText();
          bannerEl.appendChild(p);
          addPracticeButton(bannerEl);
        }
        bannerEl.hidden = bannerEl.childNodes.length === 0;
      }

      // ----- check panel (13.1-01) --------------------------------------------
      function requestUID() {
        return 'v' + Date.now().toString(36) + '-' + Math.floor(Math.random() * 1e8).toString(36);
      }

      function allChecked() {
        for (var i = 0; i < check.words.length; i++) {
          if (!check.verdicts[i] || !check.verdicts[i].manual) return false;
        }
        return true;
      }

      function renderCheckPanel() {
        var panel = $('rt-check');
        clearChildren(panel);
        if (!check.active || !check.words.length) {
          panel.hidden = true;
          return;
        }
        panel.hidden = false;

        var title = document.createElement('p');
        title.className = 'rt-check-title';
        // Issue #12: a poem check compares against the work's own lines;
        // Issue #14: a passage check compares against the range's own
        // paragraphs, labeled by the ORIGINAL 自然段号.
        title.textContent = poemTask
          ? '对照原文：每一句点「对」还是「错」'
          : (passageTask
            ? '对照原文：每一段点「对」还是「错」'
            : '检查时间：每个词点「对」还是「错」');
        panel.appendChild(title);

        check.words.forEach(function (word, i) {
          var row = document.createElement('div');
          // An OCR prefill (manual=false in the echo) keeps the row visibly
          // 待确认 — it never counts toward the submit gate (D-05).
          var st = check.verdicts[i];
          row.className = 'rt-check-row' +
            (st && !st.manual ? ' rt-check-pending' : '');

          var w = document.createElement('span');
          w.className = 'rt-check-word';
          if (passageTask) {
            var no = (passageTask.paragraphs || [])[i] || (i + 1);
            w.textContent = '第 ' + no + ' 段. ' + word;
          } else {
            w.textContent = (i + 1) + '. ' + word;
          }
          row.appendChild(w);

          // The recognized text rides ocr_result (display-only context);
          // highlighting still comes from the LATEST verdict echo (RT-07).
          var ocr = check.ocr[i];
          if (ocr && ocr.text) {
            var ocrEl = document.createElement('span');
            ocrEl.className = 'rt-ocr-text';
            ocrEl.textContent = '识别：' + ocr.text + (ocr.nearMiss ? '（好像差一点点）' : '');
            row.appendChild(ocrEl);
          }

          var yes = document.createElement('button');
          yes.type = 'button';
          yes.className = 'rt-btn rt-check-btn' + (st && st.correct ? ' rt-check-yes-on' : '');
          yes.textContent = '对';
          yes.addEventListener('click', function () { sendVerdict(i, true); });
          var no = document.createElement('button');
          no.type = 'button';
          no.className = 'rt-btn rt-check-btn' + (st && !st.correct ? ' rt-check-no-on' : '');
          no.textContent = '错';
          no.addEventListener('click', function () { sendVerdict(i, false); });
          row.appendChild(yes);
          row.appendChild(no);
          panel.appendChild(row);
        });

        // Photo controls (13.1-03, D-05): the whole notebook page in one
        // shot; 重拍 discards the in-flight upload (photo_cancel — the
        // controller only sends it after chunks shipped) and re-opens the
        // picker. Touch targets ≥60px (ipad-layout spec).
        var photoRow = document.createElement('div');
        photoRow.className = 'rt-check-photo-row';
        var take = document.createElement('button');
        take.type = 'button';
        take.className = 'rt-btn rt-check-photo';
        take.textContent = photo.isProcessing ? '正在识别…' : '拍照检查';
        take.disabled = photo.isProcessing || !photo.supported;
        take.addEventListener('click', function () { photo.pickPhoto(); });
        photoRow.appendChild(take);
        if (Object.keys(check.ocr).length > 0 || photo.isProcessing) {
          var retake = document.createElement('button');
          retake.type = 'button';
          retake.className = 'rt-btn rt-check-retake';
          retake.textContent = '重拍';
          retake.addEventListener('click', function () {
            photo.cancel();    // photo_cancel only when chunks shipped
            photo.pickPhoto(); // re-open the picker
          });
          photoRow.appendChild(retake);
        }
        panel.appendChild(photoRow);

        var submit = document.createElement('button');
        submit.type = 'button';
        submit.className = 'rt-btn rt-check-submit';
        submit.textContent = check.submitPending ? '正在提交…' : '检查完了，提交';
        // 提交 gates on the server echo covering EVERY word with a MANUAL
        // verdict — never on local taps, and an OCR prefill alone never
        // enables it (RT-07 + D-05; the server refuses such a submit too).
        // 13.1-08: terminalDraining joins the gate — after session_ended the
        // button reads 「检查完了，提交」 and stays disabled; no further
        // submit can ride a terminal session.
        submit.disabled = !allChecked() || check.submitPending || terminalDraining;
        submit.addEventListener('click', sendSubmit);
        panel.appendChild(submit);

        if (check.resultText) {
          var resultEl = document.createElement('p');
          resultEl.className = 'rt-check-result';
          resultEl.textContent = check.resultText;
          panel.appendChild(resultEl);
        }
      }

      function sendVerdict(index, correct) {
        client.sendJSON({
          type: 'check_verdict',
          request_id: requestUID(),
          word_index: index,
          correct: correct
        });
        // No local verdict mutation here: the authoritative check_verdicts
        // echo re-renders the panel (RT-07).
      }

      function sendSubmit() {
        if (!allChecked() || check.submitPending) return;
        check.submitPending = true;
        renderCheckPanel(); // disabled/pending UI while awaiting review_result
        renderProgress();
        client.sendJSON({ type: 'check_submit', request_id: requestUID() });
      }

      function renderProgress() {
        clearChildren(wordsEl);
        for (var i = 0; i < lesson.words.length; i++) {
          var chip = document.createElement('button');
          chip.type = 'button';
          // Issue #12: a poem classroom labels the chips 句 (line numbers);
          // the read_word re-reading stays disabled there pre-check — a
          // poem's lines are never read aloud (背默红线). Issue #14: a
          // passage classroom labels them with the ORIGINAL 段号.
          var unit = poemTask ? '句' : (passageTask ? '段' : '词');
          var chipNo = passageTask && !passageTask.whole
            ? ((passageTask.paragraphs || [])[i] || (i + 1))
            : (i + 1);
          chip.setAttribute('aria-label', '第 ' + chipNo + ' ' + unit);
          chip.title = poemTask || passageTask
            ? '第 ' + chipNo + ' ' + unit
            : '点击重读第 ' + (i + 1) + ' 个词';
          chip.disabled = !canReadWord(i);
          chip.addEventListener('click', sendReadWord.bind(null, i));
          if (mode === 'test' && !poemTask && !passageTask) {
            // Test mode keeps the pre-13.1 full-reveal rendering — except a
            // 背默 classroom: its lines/paragraphs stay masked in EVERY mode
            // until the check stage reveals them (Issue #12/#14).
            chip.className = 'rt-word-chip' + (i === lesson.currentIndex ? ' rt-word-current' : '');
            chip.textContent = lesson.words[i];
          } else if (lesson.words[i] === '') {
            // Student mode, unrevealed (the server sent ""): index
            // placeholder; the CURRENT index is the highlighted number with
            // no word text — the announcement is voice-only (D-09).
            chip.className = 'rt-word-chip rt-word-hidden' +
              (i < lesson.currentIndex ? ' rt-word-done' : '') +
              (i === lesson.currentIndex ? ' rt-word-current' : '');
            chip.textContent = String(i + 1);
          } else {
            // Check stage, revealed (the server sent the word): word text
            // plus the green check (the ✓ rides the CSS pseudo-element).
            chip.className = 'rt-word-chip rt-word-done';
            chip.textContent = lesson.words[i];
          }
          wordsEl.appendChild(chip);
        }
        var total = lesson.words.length; // word count is dynamic — never assumed
        if (total > 0 && lesson.currentIndex >= total) {
          progressFill.style.width = '100%';
          progressText.textContent = '已完成';
          return;
        }
        progressFill.style.width = (total > 0 ? Math.round((lesson.currentIndex / total) * 100) : 0) + '%';
        if (poemTask && !check.active) {
          // Issue #12: the writing stage has no cursor — the whole poem is
          // ONE task, never 机械推进 per line.
          progressText.textContent = '整首 ' + total + ' 句 · 凭记忆默写';
          return;
        }
        if (passageTask && !check.active) {
          // Issue #14: the same single-task shape for a passage range —
          // the banner names WHICH range this session covers.
          progressText.textContent = passageRangeText() + ' ' + total + ' 段 · 凭记忆默写';
          return;
        }
        progressText.textContent = '第 ' + (lesson.currentIndex + 1) + ' / ' + (total > 0 ? total : '-') + (poemTask ? ' 句' : (passageTask ? ' 段' : ' 个词'));
      }

      function canReadWord(index) {
        var state = statusEl.getAttribute('data-state');
        // Issue #12/#14: a 背默 classroom has NO re-reading — read_word
        // would speak the original (背默任务，老师不念原文); the server
        // refuses it too, this keeps the chip honestly disabled.
        if (poemTask || passageTask) return false;
        return started && !courseEnded && !terminalDraining && !readPending &&
          !check.submitPending && !check.resultText &&
          connEl.getAttribute('data-conn') === 'connected' &&
          (state === 'listening' || state === 'speaking' || state === 'paused') &&
          index >= 0 && index < lesson.words.length &&
          (check.active || index <= lesson.currentIndex);
      }

      function sendReadWord(index) {
        if (!canReadWord(index)) return;
        // Stop the old audio before requesting a reading under the new epoch.
        // Neither message advances the cursor or records a hint/verdict.
        if (statusEl.getAttribute('data-state') === 'speaking') playback.interruptNow();
        readPending = client.sendJSON({ type: 'read_word', word_index: index, current_index: lesson.currentIndex });
        renderProgress();
      }

      // Trace lines (13.1-02 D-10/U-7): teacher left, student right, both
      // modes. Bounded retention drops the OLDEST line via the same
      // removeChild discipline as clearChildren (bounded memory on iPad).
      var MAX_TRACE_LINES = 200;

      function trimTrace() {
        while (traceEl.children.length > MAX_TRACE_LINES) {
          traceEl.removeChild(traceEl.firstChild);
        }
      }

      function addTeacherLine(msg) {
        var line = document.createElement('div');
        line.className = 't-line rt-trace-teacher';
        line.setAttribute('data-sentence-id', msg.sentence_id);
        line.setAttribute('data-turn-id', String(msg.turn_id));
        line.textContent = '👩‍🏫 ' + msg.text;
        traceEl.appendChild(line);
        trimTrace();
        traceEl.scrollTop = traceEl.scrollHeight;
      }

      function addStudentLine(text) {
        var line = document.createElement('div');
        line.className = 't-line rt-trace-student';
        line.textContent = '🧒 ' + text;
        traceEl.appendChild(line);
        trimTrace();
        traceEl.scrollTop = traceEl.scrollHeight;
      }

      function stopEverything() {
        // Child-audio privacy boundary: a stopped session never keeps the
        // mic stream alive — MediaStreamTrack.stop happens inside.
        capture.stop();
        playback.stopNow();
        // J15 (PR #72 review P2): a stopped session retires the clarify
        // panel too — its pick buttons must not outlive the session (a
        // post-end tap could only fire into the closed socket). The next
        // subject_ask re-shows and re-enables it.
        subjectAskEl.hidden = true;
        startBtn.disabled = false;
        started = false;
      }

      // ----- terminal draining (13-11, T-13-24 / T-13-24b) -------------------
      // playback_ack_timeout and NATURAL endings share one draining path:
      // uplink stops immediately, but already-scheduled downlink audio keeps
      // playing until its real last onended (or the bounded playback-side
      // watchdog) — stopNow is forbidden here. Explicit user end, interrupt,
      // other errors and abnormal closes keep the immediate stopEverything.
      var terminalDraining = false;
      var playbackResourceReleased = false;
      // 13.3-04: the 「回首页」 door latch. Set ONLY by the three natural
      // ending reasons in the session_ended handler (lesson_complete /
      // practice_complete / no_due_words); the link itself is appended by
      // releasePlaybackResources — i.e. only after the terminal drain has
      // released the scheduled audio (T-13.3-10: never mid-summary — the
      // playback_ack_timeout path arms its drain EARLY, so the link still
      // waits for the real last onended there too). Reset at the next
      // start (13.1-08 Rule 1 site) against cross-lesson residue (T-13.3-11).
      var pendingHomeButton = false;

      function releasePlaybackResources() {
        if (playbackResourceReleased) return;
        playbackResourceReleased = true;
        playback.releaseSharedResources();
        playback.note('release');
        // J14 (PR #72 review P1): the drain's completion also releases the
        // transport. The playback_ack_timeout path can end WITHOUT any
        // session_ended (the server's orderlyCloseAt is silent for an
        // ordinary announcement), so this is the one release point that
        // covers it; after a real goodbye the session_ended handler's
        // client.close() already ran and this is an idempotent no-op.
        client.close();
        startBtn.disabled = false; // restart re-authorizes via the same button
        started = false;
        // 13.3-04: the drain is COMPLETE — scheduled audio released. Only
        // NOW may the 「回首页」 door appear (success criterion 5: the
        // lesson truly ended, the summary finished, audio freed). The link
        // rides the SAME callback that flips playbackResourceReleased, so
        // it can never precede the release (createElement/textContent
        // discipline, T-13-22 — same as every banner element).
        if (pendingHomeButton) {
          var home = document.createElement('a');
          home.href = '/home.html';
          home.className = 'rt-btn rt-btn-home';
          home.textContent = '回首页';
          bannerEl.appendChild(home);
        }
      }

      function beginTerminalDrain() {
        if (terminalDraining) return;
        terminalDraining = true;
        capture.stop();      // stop uplink capture / MediaStreamTrack now
        endBtn.disabled = true;
        playback.drainNaturally().then(function () {
          releasePlaybackResources();
        });
      }

      // ----- client wiring (wire names mirror pkg/rt/protocol.go) -----------
      client.on('session_ready', function (m) {
        courseEnded = false;
        readPending = false;
        // Issue #55: adopt the RESOLVED subject — an auto entry's outcome
        // (single-subject direct open, or the child's clarify answer) lands
        // here as a concrete english/chinese, never "auto". The next in-page
        // re-init (再练一组) rides it, so practice stays on the subject this
        // classroom actually ran under instead of being re-asked.
        if (m.category === 'chinese' || m.category === 'english') {
          client.initCategory = m.category;
        }
        // The clarify panel has served its purpose: the classroom under the
        // picked subject is now open.
        subjectAskEl.hidden = true;
        lesson.words = (m.lesson && m.lesson.words) || [];
        lesson.currentIndex = (m.lesson && m.lesson.current_index) || 0;
        lesson.version = (m.lesson && m.lesson.version) || 0;
        // Issue #12: the poem task identity rides every poem session (a
        // resumed check panel included); a word session clears it.
        poemTask = (m && m.poem) || null;
        renderPoemBanner();
        // Issue #14: the passage task + range identity rides every passage
        // session the same way.
        passageTask = (m && m.passage) || null;
        renderPassageBanner();
        // Fresh session: the previous ending's banner/notice step aside.
        bannerEl.hidden = true;
        noticeEl.hidden = true;
        // 13.1-08 WR-01: the previous lesson's check panel must not survive
        // into the new session (full state + DOM reset above).
        resetCheckState();
        setConn('connected', '已连接');
        renderProgress();
        endBtn.disabled = false;
      });

      client.on('turn_start', function (m) {
        roundText.textContent = '第 ' + m.turn_id + ' 轮';
        playback.onTurnStart(m.turn_id, m.epoch);
      });

      client.on('transcript', function (m) {
        // Persistent per-turn right column (D-10/U-7): every transcript is a
        // new line, never a replace-in-place. Text renders only what the
        // server sent (already masked in student mode — the server is the
        // masking authority; the client never desensitizes on its own).
        if (m && m.text) addStudentLine(m.text);
      });

      client.on('teacher_sentence', function (m) {
        lastTeacherText = (m && m.text) || '';
        addTeacherLine(m);
      });

      client.on('audio_start', function (m) {
        playback.onAudioStart(m.epoch, m.sentence_id);
      });

      client.on('audio_end', function (m) {
        playback.onAudioEnd(m.epoch, m.sentence_id);
      });

      client.onBinary(function (arrayBuffer) {
        playback.onAudioChunk(arrayBuffer);
      });

      client.on('state', function (m) {
        readPending = false;
        // Five-state dispatch: listening / processing / speaking / paused /
        // ended (paused chip added 13-11 — StatePaused, pkg/rt/protocol.go).
        setStatus(m.value);
        if (m && m.value === 'grading') {
          capture.stop();
        }
      });

      client.on('lesson_update', function (m) {
        lesson.currentIndex = m.current_index;
        lesson.version = m.version;
        renderProgress();
      });

      client.on('word_revealed', function (m) {
        // Ignore old-server per-word reveals during dictation. The full answer
        // list is displayed only after check_started opens the check stage.
        if (mode !== 'test' && !check.active) return;
        if (!m || typeof m.word_index !== 'number') return;
        if (m.word_index < 0 || m.word_index >= lesson.words.length) return;
        lesson.words[m.word_index] = m.word || '';
        renderProgress();
      });

      client.on('check_started', function (m) {
        // The D-10 unmask point: check_started.words is the full plaintext
        // list — the panel's single data source for rows, AND the wholesale
        // chip-list replacement (every chip flips to revealed, 解除打码).
        check.active = true;
        check.words = (m && m.words) || [];
        check.verdicts = {};
        check.ocr = {};
        check.submitPending = false;
        check.resultText = '';
        check.resultKind = '';
        lesson.words = check.words.slice();
        renderProgress();
        renderCheckPanel();
      });

      client.on('ocr_result', function (m) {
        // 13.1-03 (D-05): what the vision model recognized per word —
        // display-only context next to each row; the verdicts themselves
        // still arrive via check_verdicts (RT-07 single render source). An
        // OCR prefill keeps its row 待确认 and never counts toward the
        // submit gate — every word still needs a manual 对/错 tap.
        check.ocr = {};
        var entries = (m && m.entries) || [];
        entries.forEach(function (e) {
          if (e && typeof e.word_index === 'number') {
            check.ocr[e.word_index] = {
              text: e.ocr_text || '',
              correct: !!e.correct,
              nearMiss: !!e.near_miss
            };
          }
        });
        photo.reset(); // the recognition round is over — the button unlocks
        capture.stop();
        renderCheckPanel();
      });

      client.on('check_verdicts', function (m) {
        if (!check.active) return;
        var vs = (m && m.verdicts) || [];
        var next = {};
        vs.forEach(function (v) {
          if (v && typeof v.word_index === 'number') {
            next[v.word_index] = { correct: !!v.correct, manual: !!v.manual };
          }
        });
        check.verdicts = next;
        renderCheckPanel();
      });

      client.on('review_result', function (m) {
        check.submitPending = false;
        if (!m) return;
        if (m.requested > 0 && poemTask) {
          check.resultKind = m.updated >= m.requested ? 'saved' : 'partial';
          check.resultText = m.updated >= m.requested
            ? '整首背默结果保存好啦。'
            : formatCheckReceipt(m.requested, m.updated, m.missing || []).text;
        } else if (m.requested > 0 && passageTask) {
          check.resultKind = m.updated >= m.requested ? 'saved' : 'partial';
          check.resultText = m.updated >= m.requested
            ? '这次的背默结果保存好啦。'
            : formatCheckReceipt(m.requested, m.updated, m.missing || []).text;
        } else {
          var receipt = formatCheckReceipt(m.requested, m.updated, m.missing || []);
          check.resultText = receipt.text;
          check.resultKind = receipt.kind;
        }
        renderCheckPanel();
        renderProgress();
      });

      client.on('interrupt_ack', function (m) {
        // The server bumped the epoch — either the receipt of this page's
        // own interrupt, or a server-side termination (the subject-pick
        // killing the clarify question mid-play). Stop the queued/live old
        // audio NOW and adopt the new epoch: without the adopt, the next
        // announcement's audio (announcements carry no turn_start) would be
        // rejected as a stale epoch and the classroom would die on its
        // playback-ack timeout.
        if (m && typeof m.new_epoch === 'number') {
          playback.onEpochBump(m.new_epoch);
        }
        setStatus('listening');
      });

      client.on('error', function (m) {
        readPending = false;
        renderProgress();
        var code = m && m.code ? m.code : '';
        playback.note('error:' + (code || 'unknown'));
        showError(code, m && m.message);
        // A failed/gated photo round must leave the 拍照检查 button usable
        // (13.1-03): the OCR failure and unavailable paths answer an ErrorMsg
        // with no ocr_result — unlock the controller here.
        photo.reset();
        if (code === 'playback_ack_timeout') {
          var checkOpen = check.active && !courseEnded && !check.resultText;
          if (checkOpen) {
            return;
          }
          // Honest degraded order: the timeout code itself is NOT a
          // completion proof — drain the scheduled audio, wait for the
          // natural session_ended + normal close. Never stopNow here.
          beginTerminalDrain();
        } else if (code === 'lesson_unavailable') {
          var retry = document.createElement('p');
          retry.className = 'rt-error-retry';
          retry.textContent = '点「开始上课」可以重新试一次。';
          errorEl.appendChild(retry);
          startBtn.disabled = false;
          started = false;
        }
      });

      client.on('session_ended', function (m) {
        var reason = m && m.reason ? m.reason : '';
        playback.note('session_ended:' + reason);
        courseEnded = true;
        setStatus('ended');
        setConn('closed', '课程已结束');
        endBtn.disabled = true;
        // J14 (PR #72 review P1): the goodbye is the terminal wire message —
        // nothing may follow it, and the server's read loop only exits when
        // THIS side disconnects. The page owns releasing the transport right
        // here: a socket left open keeps the connection, its server-side
        // session manager and heartbeat alive until the page unloads, and an
        // in-page restart (再练一组 / retry) would orphan it outright. The
        // drain below only shepherds already-scheduled LOCAL audio — closing
        // now cannot truncate it, and onClose defers to terminalDraining.
        client.close();
        // 13.1-08 (loser-UI unlock, cross-AI review consensus): EVERY
        // session_ended clears a stuck 「正在提交…」 — the loser of a
        // cross-connection race receives the terminal signal INSTEAD of a
        // fabricated review_result, so its submit button would never unstick
        // without this (check.submitPending stays true forever otherwise).
        check.submitPending = false;
        // Only the three natural reasons branch here — playback_ack_timeout
        // is an ErrorMsg.Code, never a SessionEndedMsg.Reason (13-07
        // contract); practice_complete is the 13.1-05 third ending.
        if (reason === 'lesson_complete') {
          // D-13: 今天的 N 个词都默写完了 + the 再练一组 entry.
          pendingHomeButton = true; // 13.3-04: natural ending → 回首页 after drain
          showEndingBanner(reason);
          showNotice('本次课程已结束。想加练一组就点「再练一组」。');
        } else if (reason === 'practice_complete') {
          pendingHomeButton = true; // 13.3-04: natural ending → 回首页 after drain
          showEndingBanner(reason);
          showNotice('练习结束啦，休息一下吧。');
        } else if (reason === 'no_due_words') {
          pendingHomeButton = true; // 13.3-04: natural ending → 回首页 after drain
          showEndingBanner(reason);
          showNotice('今天没有到期单词，想加练一组就点「再练一组」。');
        }
        if (terminalDraining) {
          // Timeout path: presentation only — the drain armed at error time
          // releases shared playback resources after the real last onended.
          return;
        }
        if (reason === 'lesson_complete' || reason === 'no_due_words' || reason === 'practice_complete') {
          // Natural ending without a prior ErrorMsg takes the SAME drain
          // flow — no stopNow truncation of the scheduled audio.
          beginTerminalDrain();
          // 13.1-08: re-render AFTER the terminal state — the submit button
          // text returns to 「检查完了，提交」 and renders disabled (the
          // terminalDraining clause), never stuck at 「正在提交…」.
          renderCheckPanel();
          return;
        }
        // Explicit user end / other reasons: immediate teardown.
        stopEverything();
        showNotice('本次课程已结束' + (reason ? '（' + reason + '）' : '') + '。需要再练一次就点「开始上课」。');
      });

      client.onClose(function () {
        playback.note('close');
        setConn('closed', courseEnded ? '课程已结束' : '连接已断开');
        renderProgress();
        if (terminalDraining) return; // drain owns teardown; audio survives close
        stopEverything();
      });

      // ----- capture / playback wiring ---------------------------------------
      capture.onUplink(function (int16) {
        client.sendBinary(int16);
      });
      capture.onFrame(function (float32) {
        playback.onFrame(float32);
      });
      capture.onError(function (type) {
        showError(type, '');
        startBtn.disabled = false;
        started = false;
      });

      // D-06: returning to the page only resumes the AudioContext — the mic
      // stream and graph are never rebuilt mid-session.
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible' && capture.audioCtx &&
            capture.audioCtx.state === 'suspended' && capture.audioCtx.resume) {
          capture.audioCtx.resume();
        }
      });

      // ----- RT-01: safe-context detection at load ---------------------------
      var voiceReady = typeof isVoiceCaptureAvailable === 'function' &&
        isVoiceCaptureAvailable(navigator);
      if (!voiceReady) {
        var warn = document.createElement('p');
        warn.textContent = '语音不可用：需要 HTTPS 安全上下文。请通过 HTTPS（或本机 localhost）打开本页后再开始。';
        clearChildren(noticeEl);
        noticeEl.appendChild(warn);
        noticeEl.hidden = false;
        startBtn.disabled = true; // no clickable button that can only fail
        showError('voice_unavailable', '');
      }

      // ----- controls ---------------------------------------------------------
      startBtn.addEventListener('click', function () {
        if (started) return;
        if (!voiceReady) return;
        started = true;
        courseEnded = false;
        startBtn.disabled = true;
        errorEl.hidden = true;
        // 13.1-08 (Rule 1 during WR-01): terminalDraining is armed for the
        // lifetime of ONE session's ending — a NEW session must start with a
        // clean slate, or renderCheckPanel's terminalDraining gate would
        // disable the new session's check submit forever (cross-lesson leak
        // of the flag itself). Safe here: this button is only re-enabled
        // after the previous drain completed (releasePlaybackResources), so
        // no drain is in flight and the old socket is already closed.
        terminalDraining = false;
        // 13.3-04 (T-13.3-11): the home-link latch resets with it — a stale
        // flag from the previous lesson must not inject 「回首页」 into an
        // unrelated ending (13.1-08 Rule 1 same-site lesson).
        pendingHomeButton = false;
        // 13.3-04 (Rule 1, found by the practice-loop e2e): the release
        // latch resets too. releaseSharedResources is idempotent by design
        // (the restarted session re-attaches a fresh AudioContext via
        // setAudioContext), so the NEXT lesson's drain must reach it again —
        // a never-reset latch made the second lesson's drain callback
        // early-return, swallowing that lesson's 「回首页」 append.
        playbackResourceReleased = false;
        // J15/J16 (finish.spec.js found it): a NEW connection must not keep
        // the PREVIOUS session's player epoch — a page that picked a subject
        // (interrupt_ack bump) then restarted dropped the new classroom's
        // announcement audio as "stale epoch" and died on
        // playback_ack_timeout. resetSession adopts the next connection's
        // fresh epoch space at its first audio_start.
        playback.resetSession();
        setConn('connecting', '连接中…');

        // ONE user gesture (RT-02): RTCapture.start synchronously runs the
        // iOS 3-condition unlock inside this handler, then awaits
        // getUserMedia; the stream and AudioContext are held for the whole
        // session — no per-utterance hold-to-talk, no re-authorization.
        capture.start().then(function (active) {
          if (!active || !started || courseEnded) return;
          timing.push(RT_EVENTS.AUTH_COMPLETE);
          playback.setAudioContext(capture.audioCtx);
        })['catch'](function (errType) {
          showError(errType, '');
        });
        // 13.1-05 D-11: a 「再练一组」 tap consumed HERE — exactly one
        // practice session_init per tap (the flag resets; the mode param
        // rides along unchanged, D-08).
        client.initPractice = practiceNext;
        practiceNext = false;
        // Page query params ride along on the upgrade request (Go's mux
        // matches /rt by path and ignores the query); the mock e2e reads
        // them to pick its session script (?mock_pause / ?mock_empty /
        // ?mock_ack_timeout / ?mock_step_ms).
        client.connect(deriveRtUrl(window.location) + (window.location.search || ''));
      });

      endBtn.addEventListener('click', function () {
        client.sendJSON({ type: 'end_session' });
      });

      exportBtn.addEventListener('click', function () {
        timing.exportFile();
      });

      // ----- e2e hook (tests/e2e-rt/rt-loop.spec.js) ---------------------------
      window.__rtTutor = {
        client: client,
        capture: capture,
        playback: playback,
        timing: timing,
        sessionState: lesson,
        interruptNow: function () { playback.interruptNow(); },
        // Read-only test observables for the draining contract (13-11):
        // stopNowCalls counts every playback cancellation, pendingSources is
        // the scheduled-ahead source count, and the two flags prove the
        // drain path never releases shared playback resources before the
        // real last onended. Defensive defaults keep this honest before
        // rt-playback.js grows the counters. 13.1-01 adds the mode and a
        // read-only check-state snapshot (row/verdict counts + the submit
        // gate) for the mock e2e.
        observe: function () {
          var checked = 0;
          for (var i = 0; i < check.words.length; i++) {
            if (check.verdicts[i] && check.verdicts[i].manual) checked += 1;
          }
          return {
            terminalDraining: terminalDraining,
            playbackResourceReleased: playbackResourceReleased,
            stopNowCalls: playback.stopNowCalls || 0,
            pendingSources: playback._sources ? playback._sources.length : 0,
            mode: mode,
            poem: poemTask ? { title: poemTask.title, lineCount: poemTask.line_count } : null,
            passage: passageTask ? {
              title: passageTask.title,
              whole: !!passageTask.whole,
              paragraphs: (passageTask.paragraphs || []).slice(),
              paragraphCount: passageTask.paragraph_count
            } : null,
            check: {
              active: check.active,
              rows: check.words.length,
              checked: checked,
              allChecked: allChecked(),
              submitPending: check.submitPending,
              resultText: check.resultText,
              ocrRows: Object.keys(check.ocr).length,
              photoProcessing: photo.isProcessing
            }
          };
        }
      };
    })();
  </script>
</body>
