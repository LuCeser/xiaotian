<!DOCTYPE html>
<!--
  Natural Real-Time Tutor page — /tutor/ (Phase 13, Plan 05, RT-01).

  The PRIMARY student entry for the R0 minimal loop: one-gesture audio
  authorization, then continuous listen/speak with the /rt WebSocket
  (pkg/rt/protocol.go wire contract). The legacy button-driven dictation
  page (/) stays as the explicitly-labeled degraded fallback (RT-10).

  Vanilla JS + CSS only — no build step (1C/1G VPS constraint, same as the
  legacy page). Designed for iPad Safari 768x1024; touch targets ≥60px.
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#4f8ef7">
  <meta name="description" content="自然实时家教 — 听说小老师">
  <title>听说小老师 · 自然实时家教</title>
  <link rel="stylesheet" href="styles/tutor.css?v=20261007b">
</head>
<body data-page="tutor">

  <!-- Top status bar: student-facing turn state + connection state -->
  <header class="rt-topbar">
    <div class="rt-state" id="rt-status" data-state="idle" role="status" aria-live="polite">
      <span class="rt-state-chip" data-chip="listening">🎧 听取中</span>
      <span class="rt-state-chip" data-chip="processing">💭 思考中</span>
      <span class="rt-state-chip" data-chip="speaking">🗣 讲授中</span>
      <span class="rt-state-chip" data-chip="paused">⏸ 休息中</span>
      <span class="rt-state-chip" data-chip="ended">🎓 课程结束</span>
    </div>
    <div class="rt-conn" id="rt-conn" data-conn="idle" role="status">
      <span class="rt-conn-dot" aria-hidden="true"></span>
      <span class="rt-conn-text" id="rt-conn-text">未连接</span>
    </div>
  </header>

  <main class="rt-main">

    <!-- Lesson progress: words + current_index from session_ready / lesson_update -->
    <section class="rt-progress" aria-label="课堂进度">
      <div class="rt-words" id="rt-words"></div>
      <div class="rt-progress-track" aria-hidden="true">
        <div class="rt-progress-fill" id="rt-progress-fill" style="width:0%"></div>
      </div>
      <div class="rt-progress-meta">
        <span id="rt-progress-text">第 - / - 个词</span>
        <span id="rt-round">第 0 轮</span>
      </div>
    </section>

    <!-- Completion banner (session_ended reason=lesson_complete, 13-11) -->
    <section class="rt-banner" id="rt-banner" hidden role="status"></section>

    <!--
      Conversation trace (13.1-02, D-10/U-7): a two-column chat in BOTH
      modes — teacher lines append left (👩‍🏫), student transcript lines
      append right (🧒) as persistent per-turn rows (never replace-in-place).
      The aria-live region stays on the container. Line count is capped
      (MAX_TRACE_LINES) by dropping the oldest.
    -->
    <section class="rt-subtitles" aria-label="对话字幕">
      <div class="rt-trace" id="rt-trace" aria-live="polite"></div>
    </section>

    <!--
      Check panel (13.1-01): hidden until check_started opens the check
      stage; renders one 对/错 row per word from check_started.words and
      re-renders EXCLUSIVELY from authoritative check_verdicts echoes
      (RT-07 — no local optimistic verdict state). 13.1-03 adds the photo
      path (拍照检查/重拍) and the per-word recognized text from ocr_result;
      提交 gates on every word carrying a MANUAL verdict in the latest echo
      — an OCR prefill shows the row as 待确认 and never counts toward the
      gate (D-05).
    -->
    <section class="rt-check" id="rt-check" hidden aria-label="默写检查"></section>

    <!-- Error panel: code → human-readable Chinese reason (RT-10) -->
    <section class="rt-error" id="rt-error" hidden role="alert">
      <p class="rt-error-code" id="rt-error-code"></p>
      <p class="rt-error-text" id="rt-error-text"></p>
    </section>

    <!-- Degradation / notice area (unsafe context, fallback hints) -->
    <section class="rt-notice" id="rt-notice" hidden role="note"></section>

    <!-- Controls: touch targets ≥60px (ipad-layout spec) -->
    <section class="rt-controls" aria-label="会话控制">
      <button id="rt-start" class="rt-btn rt-btn-start" type="button">开始上课</button>
      <button id="rt-end" class="rt-btn rt-btn-end" type="button" disabled>结束</button>
      <button id="rt-export" class="rt-btn rt-btn-export" type="button">导出时序</button>
    </section>
  </main>

  <!--
    Script load order (end-of-body, parse order = execution order):
      js/rt-client.js    → RTCClient / TimingLog / estimateClockOffset / …
      js/rt-capture.js   → RTCapture / resampleTo16k / floatToInt16
      js/rt-playback.js  → RTCPlayback / playedUntilMs / interrupt tuning
      js/rt-photo.js     → RTPhoto / check-stage photo_chunk upload (13.1-03)
    The AudioWorklet module js/rt-pcm-worklet.js is NOT a <script> — it is
    loaded from rt-capture.js via audioContext.audioWorklet.addModule()
    (registerProcessor scope has no AudioWorkletProcessor under a plain
    script tag; loading it here would throw and break the page).
  -->
  <script src="js/rt-client.js?v=20261007b"></script>
  <script src="js/rt-capture.js?v=20261007b"></script>
  <script src="js/rt-playback.js?v=20261007b"></script>
  <script src="js/rt-photo.js?v=20261007b"></script>
  <script>
    (function () {
      'use strict';

      function $(id) { return document.getElementById(id); }
      var startBtn = $('rt-start');
      var endBtn = $('rt-end');
      var exportBtn = $('rt-export');
      var statusEl = $('rt-status');
      var connEl = $('rt-conn');
      var connText = $('rt-conn-text');
      var wordsEl = $('rt-words');
      var progressFill = $('rt-progress-fill');
      var progressText = $('rt-progress-text');
      var roundText = $('rt-round');
      var traceEl = $('rt-trace');
      var errorEl = $('rt-error');
      var errorCodeEl = $('rt-error-code');
      var errorTextEl = $('rt-error-text');
      var noticeEl = $('rt-notice');
      var bannerEl = $('rt-banner');

      // ----- shared objects -------------------------------------------------
      var timing = new TimingLog();
      timing.push(RT_EVENTS.PAGE_READY);

      var client = new RTCClient({ timing: timing });
      var capture = new RTCapture({ timing: timing });
      var playback = new RTCPlayback({ timing: timing, client: client });
      var photo = new RTPhoto(client); // 13.1-03: check-stage photo capture

      var lesson = { words: [], currentIndex: 0, version: 0 };
      var started = false;

      // ----- UI mode (13.1 D-08) ---------------------------------------------
      // Only the exact value "test" keeps the full-reveal behavior; anything
      // else — including absent — is student mode (the iPad bookmark must
      // never land the child on a full word table). The mode rides
      // session_init via client.initMode; the SERVER is the masking
      // authority (13.1-02): this page renders only what it was sent and
      // never fills in a word it did not receive.
      var mode = new URLSearchParams(window.location.search).get('mode') === 'test' ? 'test' : 'student';
      client.initMode = mode;

      // ----- check-stage state (13.1-01) --------------------------------------
      // verdicts is a server-echo mirror ONLY: it is written by
      // check_verdicts messages and read by rendering — the 对/错 buttons
      // never mutate it on press (RT-07: no local optimistic verdict state;
      // only disabled/pending UI changes at press time). ocr is the
      // ocr_result mirror (13.1-03): display-only recognized text next to
      // each row; the verdicts still come from check_verdicts alone.
      var check = { active: false, words: [], verdicts: {}, ocr: {}, submitPending: false, resultText: '' };

      // ----- DOM helpers ----------------------------------------------------
      // The ONLY element-removal helper on this page: server-sourced text
      // (subtitles, transcripts, errors, teacher lines) never touches an HTML
      // parser — createElement/textContent discipline is the XSS boundary
      // (T-13-22, enforced by the negative grep gate).
      function clearChildren(el) {
        while (el.firstChild) el.removeChild(el.firstChild);
      }

      function setStatus(state) {
        statusEl.setAttribute('data-state', state);
      }

      function setConn(state, text) {
        connEl.setAttribute('data-conn', state);
        connText.textContent = text;
      }

      function showError(code, message) {
        errorCodeEl.textContent = code || 'unknown';
        errorTextEl.textContent = humanizeError(code) + (message ? '（' + message + '）' : '');
        errorEl.hidden = false;
      }

      function showNotice(text) {
        clearChildren(noticeEl);
        var p = document.createElement('p');
        p.textContent = text;
        noticeEl.appendChild(p);
        noticeEl.hidden = false;
      }

      function showCompletionBanner() {
        clearChildren(bannerEl);
        var p = document.createElement('p');
        // 13.1-01: when the check stage ran, the banner carries the honest
        // save result (review_result) — never a fabricated full success.
        p.textContent = check.resultText
          ? '今天的默写课堂完成啦！' + check.resultText
          : '今天的默写课堂完成啦，真棒！';
        bannerEl.appendChild(p);
        bannerEl.hidden = false;
      }

      // ----- check panel (13.1-01) --------------------------------------------
      function requestUID() {
        return 'v' + Date.now().toString(36) + '-' + Math.floor(Math.random() * 1e8).toString(36);
      }

      function allChecked() {
        for (var i = 0; i < check.words.length; i++) {
          if (!check.verdicts[i] || !check.verdicts[i].manual) return false;
        }
        return true;
      }

      function renderCheckPanel() {
        var panel = $('rt-check');
        clearChildren(panel);
        if (!check.active || !check.words.length) {
          panel.hidden = true;
          return;
        }
        panel.hidden = false;

        var title = document.createElement('p');
        title.className = 'rt-check-title';
        title.textContent = '检查时间：每个词点「对」还是「错」';
        panel.appendChild(title);

        check.words.forEach(function (word, i) {
          var row = document.createElement('div');
          // An OCR prefill (manual=false in the echo) keeps the row visibly
          // 待确认 — it never counts toward the submit gate (D-05).
          var st = check.verdicts[i];
          row.className = 'rt-check-row' +
            (st && !st.manual ? ' rt-check-pending' : '');

          var w = document.createElement('span');
          w.className = 'rt-check-word';
          w.textContent = (i + 1) + '. ' + word;
          row.appendChild(w);

          // The recognized text rides ocr_result (display-only context);
          // highlighting still comes from the LATEST verdict echo (RT-07).
          var ocr = check.ocr[i];
          if (ocr && ocr.text) {
            var ocrEl = document.createElement('span');
            ocrEl.className = 'rt-ocr-text';
            ocrEl.textContent = '识别：' + ocr.text + (ocr.nearMiss ? '（好像差一点点）' : '');
            row.appendChild(ocrEl);
          }

          var yes = document.createElement('button');
          yes.type = 'button';
          yes.className = 'rt-btn rt-check-btn' + (st && st.correct ? ' rt-check-yes-on' : '');
          yes.textContent = '对';
          yes.addEventListener('click', function () { sendVerdict(i, true); });
          var no = document.createElement('button');
          no.type = 'button';
          no.className = 'rt-btn rt-check-btn' + (st && !st.correct ? ' rt-check-no-on' : '');
          no.textContent = '错';
          no.addEventListener('click', function () { sendVerdict(i, false); });
          row.appendChild(yes);
          row.appendChild(no);
          panel.appendChild(row);
        });

        // Photo controls (13.1-03, D-05): the whole notebook page in one
        // shot; 重拍 discards the in-flight upload (photo_cancel — the
        // controller only sends it after chunks shipped) and re-opens the
        // picker. Touch targets ≥60px (ipad-layout spec).
        var photoRow = document.createElement('div');
        photoRow.className = 'rt-check-photo-row';
        var take = document.createElement('button');
        take.type = 'button';
        take.className = 'rt-btn rt-check-photo';
        take.textContent = photo.isProcessing ? '正在识别…' : '拍照检查';
        take.disabled = photo.isProcessing || !photo.supported;
        take.addEventListener('click', function () { photo.pickPhoto(); });
        photoRow.appendChild(take);
        if (Object.keys(check.ocr).length > 0 || photo.isProcessing) {
          var retake = document.createElement('button');
          retake.type = 'button';
          retake.className = 'rt-btn rt-check-retake';
          retake.textContent = '重拍';
          retake.addEventListener('click', function () {
            photo.cancel();    // photo_cancel only when chunks shipped
            photo.pickPhoto(); // re-open the picker
          });
          photoRow.appendChild(retake);
        }
        panel.appendChild(photoRow);

        var submit = document.createElement('button');
        submit.type = 'button';
        submit.className = 'rt-btn rt-check-submit';
        submit.textContent = check.submitPending ? '正在提交…' : '检查完了，提交';
        // 提交 gates on the server echo covering EVERY word with a MANUAL
        // verdict — never on local taps, and an OCR prefill alone never
        // enables it (RT-07 + D-05; the server refuses such a submit too).
        submit.disabled = !allChecked() || check.submitPending;
        submit.addEventListener('click', sendSubmit);
        panel.appendChild(submit);
      }

      function sendVerdict(index, correct) {
        client.sendJSON({
          type: 'check_verdict',
          request_id: requestUID(),
          word_index: index,
          correct: correct
        });
        // No local verdict mutation here: the authoritative check_verdicts
        // echo re-renders the panel (RT-07).
      }

      function sendSubmit() {
        if (!allChecked() || check.submitPending) return;
        check.submitPending = true;
        renderCheckPanel(); // disabled/pending UI while awaiting review_result
        client.sendJSON({ type: 'check_submit', request_id: requestUID() });
      }

      function renderProgress() {
        clearChildren(wordsEl);
        for (var i = 0; i < lesson.words.length; i++) {
          var chip = document.createElement('span');
          if (mode === 'test') {
            // Test mode keeps the pre-13.1 full-reveal rendering.
            chip.className = 'rt-word-chip' + (i === lesson.currentIndex ? ' rt-word-current' : '');
            chip.textContent = lesson.words[i];
          } else if (lesson.words[i] === '') {
            // Student mode, unrevealed (the server sent ""): index
            // placeholder; the CURRENT index is the highlighted number with
            // no word text — the announcement is voice-only (D-09).
            chip.className = 'rt-word-chip rt-word-hidden' + (i === lesson.currentIndex ? ' rt-word-current' : '');
            chip.textContent = String(i + 1);
          } else {
            // Student mode, revealed (the server sent the word): word text
            // plus the green check (the ✓ rides the CSS pseudo-element).
            chip.className = 'rt-word-chip rt-word-done';
            chip.textContent = lesson.words[i];
          }
          wordsEl.appendChild(chip);
        }
        var total = lesson.words.length; // word count is dynamic — never assumed
        if (total > 0 && lesson.currentIndex >= total) {
          progressFill.style.width = '100%';
          progressText.textContent = '已完成';
          return;
        }
        progressFill.style.width = (total > 0 ? Math.round((lesson.currentIndex / total) * 100) : 0) + '%';
        progressText.textContent = '第 ' + (lesson.currentIndex + 1) + ' / ' + (total > 0 ? total : '-') + ' 个词';
      }

      // Trace lines (13.1-02 D-10/U-7): teacher left, student right, both
      // modes. Bounded retention drops the OLDEST line via the same
      // removeChild discipline as clearChildren (bounded memory on iPad).
      var MAX_TRACE_LINES = 200;

      function trimTrace() {
        while (traceEl.children.length > MAX_TRACE_LINES) {
          traceEl.removeChild(traceEl.firstChild);
        }
      }

      function addTeacherLine(msg) {
        var line = document.createElement('div');
        line.className = 't-line rt-trace-teacher';
        line.setAttribute('data-sentence-id', msg.sentence_id);
        line.setAttribute('data-turn-id', String(msg.turn_id));
        line.textContent = '👩‍🏫 ' + msg.text;
        traceEl.appendChild(line);
        trimTrace();
        traceEl.scrollTop = traceEl.scrollHeight;
      }

      function addStudentLine(text) {
        var line = document.createElement('div');
        line.className = 't-line rt-trace-student';
        line.textContent = '🧒 ' + text;
        traceEl.appendChild(line);
        trimTrace();
        traceEl.scrollTop = traceEl.scrollHeight;
      }

      function stopEverything() {
        // Child-audio privacy boundary: a stopped session never keeps the
        // mic stream alive — MediaStreamTrack.stop happens inside.
        capture.stop();
        playback.stopNow();
        startBtn.disabled = false;
        started = false;
      }

      // ----- terminal draining (13-11, T-13-24 / T-13-24b) -------------------
      // playback_ack_timeout and NATURAL endings share one draining path:
      // uplink stops immediately, but already-scheduled downlink audio keeps
      // playing until its real last onended (or the bounded playback-side
      // watchdog) — stopNow is forbidden here. Explicit user end, interrupt,
      // other errors and abnormal closes keep the immediate stopEverything.
      var terminalDraining = false;
      var playbackResourceReleased = false;

      function releasePlaybackResources() {
        if (playbackResourceReleased) return;
        playbackResourceReleased = true;
        playback.releaseSharedResources();
        playback.note('release');
        startBtn.disabled = false; // restart re-authorizes via the same button
        started = false;
      }

      function beginTerminalDrain() {
        if (terminalDraining) return;
        terminalDraining = true;
        capture.stop();      // stop uplink capture / MediaStreamTrack now
        endBtn.disabled = true;
        playback.drainNaturally().then(function () {
          releasePlaybackResources();
        });
      }

      // ----- client wiring (wire names mirror pkg/rt/protocol.go) -----------
      client.on('session_ready', function (m) {
        lesson.words = (m.lesson && m.lesson.words) || [];
        lesson.currentIndex = (m.lesson && m.lesson.current_index) || 0;
        lesson.version = (m.lesson && m.lesson.version) || 0;
        renderProgress();
        setConn('connected', '已连接');
        endBtn.disabled = false;
      });

      client.on('turn_start', function (m) {
        roundText.textContent = '第 ' + m.turn_id + ' 轮';
        playback.onTurnStart(m.turn_id, m.epoch);
      });

      client.on('transcript', function (m) {
        // Persistent per-turn right column (D-10/U-7): every transcript is a
        // new line, never a replace-in-place. Text renders only what the
        // server sent (already masked in student mode — the server is the
        // masking authority; the client never desensitizes on its own).
        if (m && m.text) addStudentLine(m.text);
      });

      client.on('teacher_sentence', function (m) {
        addTeacherLine(m);
      });

      client.on('audio_start', function (m) {
        playback.onAudioStart(m.epoch, m.sentence_id);
      });

      client.on('audio_end', function (m) {
        playback.onAudioEnd(m.epoch, m.sentence_id);
      });

      client.onBinary(function (arrayBuffer) {
        playback.onAudioChunk(arrayBuffer);
      });

      client.on('state', function (m) {
        // Five-state dispatch: listening / processing / speaking / paused /
        // ended (paused chip added 13-11 — StatePaused, pkg/rt/protocol.go).
        setStatus(m.value);
      });

      client.on('lesson_update', function (m) {
        lesson.currentIndex = m.current_index;
        lesson.version = m.version;
        renderProgress();
      });

      client.on('word_revealed', function (m) {
        // Per-word reveal (13.1-02, D-09): the chip state derives ONLY from
        // server data — the client never fills in a word it was not sent.
        if (!m || typeof m.word_index !== 'number') return;
        if (m.word_index < 0 || m.word_index >= lesson.words.length) return;
        lesson.words[m.word_index] = m.word || '';
        renderProgress();
      });

      client.on('check_started', function (m) {
        // The D-10 unmask point: check_started.words is the full plaintext
        // list — the panel's single data source for rows, AND the wholesale
        // chip-list replacement (every chip flips to revealed, 解除打码).
        check.active = true;
        check.words = (m && m.words) || [];
        check.verdicts = {};
        check.ocr = {};
        check.submitPending = false;
        check.resultText = '';
        lesson.words = check.words.slice();
        renderProgress();
        renderCheckPanel();
      });

      client.on('ocr_result', function (m) {
        // 13.1-03 (D-05): what the vision model recognized per word —
        // display-only context next to each row; the verdicts themselves
        // still arrive via check_verdicts (RT-07 single render source). An
        // OCR prefill keeps its row 待确认 and never counts toward the
        // submit gate — every word still needs a manual 对/错 tap.
        check.ocr = {};
        var entries = (m && m.entries) || [];
        entries.forEach(function (e) {
          if (e && typeof e.word_index === 'number') {
            check.ocr[e.word_index] = {
              text: e.ocr_text || '',
              correct: !!e.correct,
              nearMiss: !!e.near_miss
            };
          }
        });
        photo.reset(); // the recognition round is over — the button unlocks
        renderCheckPanel();
      });

      client.on('check_verdicts', function (m) {
        if (!check.active) return;
        var vs = (m && m.verdicts) || [];
        var next = {};
        vs.forEach(function (v) {
          if (v && typeof v.word_index === 'number') {
            next[v.word_index] = { correct: !!v.correct, manual: !!v.manual };
          }
        });
        check.verdicts = next;
        renderCheckPanel();
      });

      client.on('review_result', function (m) {
        check.submitPending = false;
        if (!m) return;
        // Honest copy from the REAL sets — partial/zero updates are never
        // dressed up as success (prohibition P3, S-05).
        if (m.requested > 0 && m.updated < m.requested) {
          check.resultText = '保存了 ' + m.updated + ' / ' + m.requested + ' 个，别担心，下次会补上。';
        } else if (m.requested > 0) {
          check.resultText = '学习记录保存好了，' + m.requested + ' 个词都记上啦。';
        } else {
          check.resultText = '这次没有要保存的学习记录。';
        }
        renderCheckPanel();
      });

      client.on('interrupt_ack', function () {
        setStatus('listening');
      });

      client.on('error', function (m) {
        var code = m && m.code ? m.code : '';
        playback.note('error:' + (code || 'unknown'));
        showError(code, m && m.message);
        // A failed/gated photo round must leave the 拍照检查 button usable
        // (13.1-03): the OCR failure and unavailable paths answer an ErrorMsg
        // with no ocr_result — unlock the controller here.
        photo.reset();
        if (code === 'playback_ack_timeout') {
          // Honest degraded order: the timeout code itself is NOT a
          // completion proof — drain the scheduled audio, wait for the
          // natural session_ended + normal close. Never stopNow here.
          beginTerminalDrain();
        } else if (code === 'lesson_unavailable') {
          var retry = document.createElement('p');
          retry.className = 'rt-error-retry';
          retry.textContent = '点「开始上课」可以重新试一次。';
          errorEl.appendChild(retry);
          startBtn.disabled = false;
          started = false;
        }
      });

      client.on('session_ended', function (m) {
        var reason = m && m.reason ? m.reason : '';
        playback.note('session_ended:' + reason);
        setStatus('ended');
        setConn('closed', '课程已结束');
        endBtn.disabled = true;
        // Only the two natural reasons branch here — playback_ack_timeout is
        // an ErrorMsg.Code, never a SessionEndedMsg.Reason (13-07 contract).
        if (reason === 'lesson_complete') {
          // Subtitles keep the wrap-up summary; banner marks completion.
          showCompletionBanner();
          showNotice('本次课程已结束。需要再练一次就点「开始上课」。');
        } else if (reason === 'no_due_words') {
          showNotice('今天没有到期单词，休息一天吧。');
        }
        if (terminalDraining) {
          // Timeout path: presentation only — the drain armed at error time
          // releases shared playback resources after the real last onended.
          return;
        }
        if (reason === 'lesson_complete' || reason === 'no_due_words') {
          // Natural ending without a prior ErrorMsg takes the SAME drain
          // flow — no stopNow truncation of the scheduled audio.
          beginTerminalDrain();
          return;
        }
        // Explicit user end / other reasons: immediate teardown.
        stopEverything();
        showNotice('本次课程已结束' + (reason ? '（' + reason + '）' : '') + '。需要再练一次就点「开始上课」。');
      });

      client.onClose(function () {
        playback.note('close');
        setConn('closed', '已断开');
        if (terminalDraining) return; // drain owns teardown; audio survives close
        stopEverything();
      });

      // ----- capture / playback wiring ---------------------------------------
      capture.onUplink(function (int16) {
        client.sendBinary(int16);
      });
      capture.onFrame(function (float32) {
        playback.onFrame(float32);
      });
      capture.onError(function (type) {
        showError(type, '');
        startBtn.disabled = false;
        started = false;
      });

      // D-06: returning to the page only resumes the AudioContext — the mic
      // stream and graph are never rebuilt mid-session.
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible' && capture.audioCtx &&
            capture.audioCtx.state === 'suspended' && capture.audioCtx.resume) {
          capture.audioCtx.resume();
        }
      });

      // ----- RT-01: safe-context detection at load ---------------------------
      var voiceReady = typeof isVoiceCaptureAvailable === 'function' &&
        isVoiceCaptureAvailable(navigator);
      if (!voiceReady) {
        var warn = document.createElement('p');
        warn.textContent = '语音不可用：需要 HTTPS 安全上下文。请通过 HTTPS（或本机 localhost）打开本页后再开始。';
        clearChildren(noticeEl);
        noticeEl.appendChild(warn);
        noticeEl.hidden = false;
        startBtn.disabled = true; // no clickable button that can only fail
        showError('voice_unavailable', '');
      }

      // ----- controls ---------------------------------------------------------
      startBtn.addEventListener('click', function () {
        if (started) return;
        if (!voiceReady) return;
        started = true;
        startBtn.disabled = true;
        errorEl.hidden = true;
        setConn('connecting', '连接中…');

        // ONE user gesture (RT-02): RTCapture.start synchronously runs the
        // iOS 3-condition unlock inside this handler, then awaits
        // getUserMedia; the stream and AudioContext are held for the whole
        // session — no per-utterance hold-to-talk, no re-authorization.
        capture.start().then(function () {
          timing.push(RT_EVENTS.AUTH_COMPLETE);
          playback.setAudioContext(capture.audioCtx);
        })['catch'](function (errType) {
          showError(errType, '');
        });
        // Page query params ride along on the upgrade request (Go's mux
        // matches /rt by path and ignores the query); the mock e2e reads
        // them to pick its session script (?mock_pause / ?mock_empty /
        // ?mock_ack_timeout / ?mock_step_ms).
        client.connect(deriveRtUrl(window.location) + (window.location.search || ''));
      });

      endBtn.addEventListener('click', function () {
        client.sendJSON({ type: 'end_session' });
      });

      exportBtn.addEventListener('click', function () {
        timing.exportFile();
      });

      // ----- e2e hook (tests/e2e-rt/rt-loop.spec.js) ---------------------------
      window.__rtTutor = {
        client: client,
        capture: capture,
        playback: playback,
        timing: timing,
        sessionState: lesson,
        interruptNow: function () { playback.interruptNow(); },
        // Read-only test observables for the draining contract (13-11):
        // stopNowCalls counts every playback cancellation, pendingSources is
        // the scheduled-ahead source count, and the two flags prove the
        // drain path never releases shared playback resources before the
        // real last onended. Defensive defaults keep this honest before
        // rt-playback.js grows the counters. 13.1-01 adds the mode and a
        // read-only check-state snapshot (row/verdict counts + the submit
        // gate) for the mock e2e.
        observe: function () {
          var checked = 0;
          for (var i = 0; i < check.words.length; i++) {
            if (check.verdicts[i] && check.verdicts[i].manual) checked += 1;
          }
          return {
            terminalDraining: terminalDraining,
            playbackResourceReleased: playbackResourceReleased,
            stopNowCalls: playback.stopNowCalls || 0,
            pendingSources: playback._sources ? playback._sources.length : 0,
            mode: mode,
            check: {
              active: check.active,
              rows: check.words.length,
              checked: checked,
              allChecked: allChecked(),
              submitPending: check.submitPending,
              resultText: check.resultText,
              ocrRows: Object.keys(check.ocr).length,
              photoProcessing: photo.isProcessing
            }
          };
        }
      };
    })();
  </script>
</body>
</html>
