name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -trimpath
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - run: go mod download

      - run: make vet

      # Action v6 treats "latest" as the newest v1 release. That binary is
      # v1.64.8, built with go1.24, and it refuses a module whose go
      # directive is 1.26. v9 installs golangci-lint v2; pin a release
      # whose official binary is built with Go >= 1.26 (v2.14.0: go1.27).
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: --config=.golangci.yml

      # make test runs `go test -race`, which needs cgo; the job-level
      # CGO_ENABLED=0 (kept for make build's static binary) starves it.
      - run: make test
        env:
          CGO_ENABLED: 1

      - run: make build

      - uses: actions/upload-artifact@v4
        with:
          name: service-binary
          path: bin/service
          if-no-files-found: error
