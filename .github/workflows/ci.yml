name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -trimpath
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - run: go mod download

      - run: make vet

      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --config=.golangci.yml

      - run: make test

      - run: make build

      - uses: actions/upload-artifact@v4
        with:
          name: service-binary
          path: bin/service
          if-no-files-found: error
