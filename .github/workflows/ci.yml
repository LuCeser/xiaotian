name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -trimpath
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - run: go mod download

      - run: make vet

      # Action v6 treats "latest" as the newest v1 release. That binary is
      # v1.64.8, built with go1.24, and it refuses a module whose go
      # directive is 1.26. v9 installs golangci-lint v2; pin a release
      # whose official binary is built with Go >= 1.26 (v2.14.0: go1.27).
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: --config=.golangci.yml

      # -race needs cgo; the job-level CGO_ENABLED=0 stays for make build's
      # static binary (issue #26: the mix silently disabled race detection
      # for months — the test step must override explicitly).
      - run: make test
        env:
          CGO_ENABLED: 1

      - run: make build

      - uses: actions/upload-artifact@v4
        with:
          name: service-binary
          path: bin/service
          if-no-files-found: error

  # Milestone-1 B-layer browser e2e (issue #58, e2e-test-plan §6 / §7 step
  # 16): real page + real Go service + real Python + real SQLite — ONLY the
  # external vendor HTTP boundary is replaced (strict stub). No key anywhere:
  # the launcher pins MIMO_API_KEY to a local dummy and points voice.baseUrl
  # at the stub, so this job must never read or need a real secret. It runs
  # the exact local command (`npm run e2e:m1`) through the cross-platform
  # launcher, which compiles cmd/service from THIS checkout (never a stale
  # bin/service) — hence the Go toolchain here too.
  m1-browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOFLAGS: -trimpath
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Real Python is mandatory for the B layer: every word seed goes
      # REST → vocab_manager.py → SQLite, and vocab_manager imports fsrs at
      # module level. The venv lives at the `make py-bootstrap` location
      # (gitignored; service-launcher.js resolvePython auto-detects it). The
      # runner's bare python3 has no deps ON PURPOSE: if this step is ever
      # dropped the classroom specs must fail at seeding, not silently pass.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m venv third_party/python/.venv
      - run: third_party/python/.venv/bin/pip install -r third_party/python/requirements.txt

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm test

      # list reporter for the log, JSON for the mandatory-case check below.
      # Playwright's own exit code fails the job on any failed test; the
      # check step catches the OTHER failure modes — a green run whose cases
      # never executed (browser/Python/launcher missing → all skipped), a
      # required case deleted/renamed while filler keeps counts up, or a
      # test.fail() expected failure that stats.expected counts as fine.
      - run: npm run e2e:m1 -- --reporter=list,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: reports/m1-results.json
      - name: Verify the B-layer core set actually ran (no silent pass)
        run: node scripts/check-m1-report.mjs reports/m1-results.json
